name: Daily Dashboard Email

on:
  schedule:
    # 10:00 UTC = 1:00 PM Baghdad time
    - cron: "0 10 * * *"

  # يسمح لنا بتجربة الإرسال يدوياً
  workflow_dispatch:

jobs:
  send-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Send Firebase dashboard report
        shell: bash
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          FIREBASE_ROOM: ${{ secrets.FIREBASE_ROOM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}

        run: |
          node <<'NODE'
          const required = [
            "BREVO_API_KEY",
            "FIREBASE_CONFIG",
            "FIREBASE_ROOM",
            "EMAIL_TO",
            "SENDER_EMAIL"
          ];

          for (const key of required) {
            if (!process.env[key]) {
              throw new Error(`Missing GitHub Secret: ${key}`);
            }
          }

          function parseFirebaseConfig(value) {
            try {
              return JSON.parse(value);
            } catch {
              // يدعم أيضاً صيغة JavaScript الموجودة في الداشبورد
              const cleaned = value
                .replace(/^\s*(const|let|var)\s+\w+\s*=\s*/, "")
                .replace(/;\s*$/, "");

              return Function(`"use strict"; return (${cleaned});`)();
            }
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");
          }

          function getProjectName(project, index) {
            return (
              project?.name ||
              project?.title ||
              project?.projectName ||
              project?.nameEn ||
              `Project ${index + 1}`
            );
          }

          function getProgress(project) {
            const possible = [
              project?.progress,
              project?.overallProgress,
              project?.completion,
              project?.percentage,
              project?.pct
            ];

            for (const value of possible) {
              const number = Number(value);
              if (Number.isFinite(number)) {
                return Math.max(0, Math.min(100, Math.round(number)));
              }
            }

            return 0;
          }

          function getStatus(project, progress) {
            const status =
              project?.status ||
              project?.projectStatus ||
              project?.rag ||
              "";

            if (status) return String(status);
            if (progress >= 100) return "Completed";
            if (progress > 0) return "In Progress";
            return "Not Started";
          }

          function statusColor(status) {
            const text = String(status).toLowerCase();

            if (
              text.includes("complete") ||
              text.includes("done") ||
              text.includes("closed")
            ) return "#2E7D5B";

            if (
              text.includes("delay") ||
              text.includes("risk") ||
              text.includes("critical") ||
              text.includes("late")
            ) return "#B0202E";

            if (
              text.includes("hold") ||
              text.includes("pending")
            ) return "#8A6A2C";

            return "#41618A";
          }

          async function main() {
            const config = parseFirebaseConfig(
              process.env.FIREBASE_CONFIG
            );

            if (!config.databaseURL) {
              throw new Error(
                "FIREBASE_CONFIG does not contain databaseURL"
              );
            }

            const databaseURL = String(config.databaseURL)
              .replace(/\/+$/, "");

            const room = encodeURIComponent(
              process.env.FIREBASE_ROOM.trim()
            );

            const firebaseURL =
              `${databaseURL}/portals/${room}.json`;

            console.log(
              `Reading Firebase room: ${process.env.FIREBASE_ROOM}`
            );

            const firebaseResponse = await fetch(firebaseURL);

            if (!firebaseResponse.ok) {
              const message = await firebaseResponse.text();
              throw new Error(
                `Firebase error ${firebaseResponse.status}: ${message}`
              );
            }

            const store = await firebaseResponse.json();

            if (!store) {
              throw new Error(
                "No data found in the selected Firebase room"
              );
            }

            const projects = Array.isArray(store.projects)
              ? store.projects
              : [];

            if (projects.length === 0) {
              throw new Error(
                "Firebase connected, but no projects were found"
              );
            }

            const rows = projects.map((project, index) => {
              const name = getProjectName(project, index);
              const progress = getProgress(project);
              const status = getStatus(project, progress);
              const color = statusColor(status);

              return `
                <tr>
                  <td style="padding:11px;border-bottom:1px solid #E5E9F1;font-weight:600;">
                    ${escapeHtml(name)}
                  </td>

                  <td style="padding:11px;border-bottom:1px solid #E5E9F1;text-align:center;">
                    <div style="background:#EEF1F4;border-radius:20px;height:8px;overflow:hidden;min-width:100px;">
                      <div style="width:${progress}%;height:8px;background:#B12836;"></div>
                    </div>
                    <div style="margin-top:4px;font-weight:700;">
                      ${progress}%
                    </div>
                  </td>

                  <td style="padding:11px;border-bottom:1px solid #E5E9F1;text-align:center;">
                    <span style="display:inline-block;padding:5px 10px;border-radius:20px;background:${color}18;color:${color};font-weight:700;">
                      ${escapeHtml(status)}
                    </span>
                  </td>
                </tr>
              `;
            }).join("");

            const completed = projects.filter((project) => {
              const progress = getProgress(project);
              const status = getStatus(project, progress).toLowerCase();

              return (
                progress >= 100 ||
                status.includes("complete") ||
                status.includes("done")
              );
            }).length;

            const delayed = projects.filter((project) => {
              const status = getStatus(
                project,
                getProgress(project)
              ).toLowerCase();

              return (
                status.includes("delay") ||
                status.includes("late") ||
                status.includes("critical") ||
                status.includes("risk")
              );
            }).length;

            const averageProgress = Math.round(
              projects.reduce(
                (total, project) =>
                  total + getProgress(project),
                0
              ) / projects.length
            );

            const baghdadDate = new Intl.DateTimeFormat(
              "en-GB",
              {
                timeZone: "Asia/Baghdad",
                dateStyle: "full",
                timeStyle: "short"
              }
            ).format(new Date());

            const html = `
              <!DOCTYPE html>
              <html>
                <body style="margin:0;background:#F4F6F9;font-family:Arial,sans-serif;color:#20242E;">
                  <div style="max-width:850px;margin:20px auto;background:#FFFFFF;border-radius:14px;overflow:hidden;border:1px solid #E5E9F1;">

                    <div style="padding:24px;background:#B12836;color:#FFFFFF;">
                      <h1 style="margin:0;font-size:22px;">
                        Knowledge Papers — Daily PMO Update
                      </h1>
                      <div style="margin-top:7px;opacity:.85;">
                        ${escapeHtml(baghdadDate)}
                      </div>
                    </div>

                    <div style="padding:22px;">
                      <table role="presentation" style="width:100%;border-collapse:separate;border-spacing:10px;">
                        <tr>
                          <td style="background:#F4F6F9;padding:16px;text-align:center;border-radius:10px;">
                            <div style="font-size:26px;font-weight:800;color:#B12836;">
                              ${projects.length}
                            </div>
                            <div style="font-size:12px;color:#6B7280;">
                              Total Projects
                            </div>
                          </td>

                          <td style="background:#F4F6F9;padding:16px;text-align:center;border-radius:10px;">
                            <div style="font-size:26px;font-weight:800;color:#2E7D5B;">
                              ${completed}
                            </div>
                            <div style="font-size:12px;color:#6B7280;">
                              Completed
                            </div>
                          </td>

                          <td style="background:#F4F6F9;padding:16px;text-align:center;border-radius:10px;">
                            <div style="font-size:26px;font-weight:800;color:#B0202E;">
                              ${delayed}
                            </div>
                            <div style="font-size:12px;color:#6B7280;">
                              Delayed / At Risk
                            </div>
                          </td>

                          <td style="background:#F4F6F9;padding:16px;text-align:center;border-radius:10px;">
                            <div style="font-size:26px;font-weight:800;color:#41618A;">
                              ${averageProgress}%
                            </div>
                            <div style="font-size:12px;color:#6B7280;">
                              Average Progress
                            </div>
                          </td>
                        </tr>
                      </table>

                      <h2 style="font-size:17px;margin:20px 0 10px;">
                        Project Portfolio
                      </h2>

                      <table style="width:100%;border-collapse:collapse;border:1px solid #E5E9F1;">
                        <thead>
                          <tr style="background:#F4F6F9;">
                            <th style="padding:11px;text-align:left;">Project</th>
                            <th style="padding:11px;text-align:center;">Progress</th>
                            <th style="padding:11px;text-align:center;">Status</th>
                          </tr>
                        </thead>

                        <tbody>
                          ${rows}
                        </tbody>
                      </table>

                      <p style="margin-top:20px;font-size:12px;color:#8A97A6;">
                        This report was generated automatically from Firebase Realtime Database.
                      </p>
                    </div>
                  </div>
                </body>
              </html>
            `;

            const recipients = process.env.EMAIL_TO
              .split(/[;,]/)
              .map(email => email.trim())
              .filter(Boolean)
              .map(email => ({ email }));

            if (recipients.length === 0) {
              throw new Error("EMAIL_TO contains no valid recipients");
            }

            const brevoResponse = await fetch(
              "https://api.brevo.com/v3/smtp/email",
              {
                method: "POST",
                headers: {
                  "accept": "application/json",
                  "api-key": process.env.BREVO_API_KEY,
                  "content-type": "application/json"
                },
                body: JSON.stringify({
                  sender: {
                    name: "Knowledge Papers PMO",
                    email: process.env.SENDER_EMAIL
                  },
                  to: recipients,
                  subject: `Daily PMO Dashboard Update — ${projects.length} Projects`,
                  htmlContent: html
                })
              }
            );

            const brevoText = await brevoResponse.text();

            if (!brevoResponse.ok) {
              throw new Error(
                `Brevo error ${brevoResponse.status}: ${brevoText}`
              );
            }

            console.log("Email sent successfully.");
            console.log(brevoText);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
