<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Knowledge Papers — Work Place Hub</title>
<link rel="icon" type="image/png" href="/Logo%20PNG.png">
<link rel="apple-touch-icon" href="/Logo%20PNG.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --brand:#B12836; --brand-2:#CB2E28; --brand-deep:#8A1E2A; --brand-soft:#F7E3E5; --brand-light:rgba(177,40,54,.08);
  --good:#2E7D5B; --good-bg:#EAF2EC; --warn:#8A6A2C; --warn-bg:#F2ECDD;
  --risk:#B0202E; --risk-bg:#F6E4E6; --info:#41618A; --info-bg:#E9EEF5;
  --muted-st:#5B6572; --muted-bg:#EEF1F4;
  --ink:#20242E; --ink-2:#3B4048; --ink-3:#6B7280; --muted:#8A97A6;
  --line:#E5E9F1; --line-soft:#EDF0F5; --bg:#F4F6F9; --card:#FFFFFF;
  --disp:'Calibri','Segoe UI','Montserrat',sans-serif;
  --body:'Calibri','Segoe UI','IBM Plex Sans Arabic',sans-serif;
  --mono:'IBM Plex Mono','Consolas',monospace;
  --r:12px; --r-sm:8px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 8px 20px -14px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select,textarea{font-family:var(--body)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── App bar ─────────────────────────────────────────────────── */
.appbar{position:sticky;top:0;z-index:60;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:14px;padding:0 18px;height:58px;
  box-shadow:0 2px 14px -6px rgba(16,24,40,.5)}
.ab-logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;flex:0 0 auto;padding:5px}
.ab-logo img{display:block;width:100%;height:100%;object-fit:contain}
.ab-title{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.ab-title small{display:block;font-size:10.5px;font-weight:600;opacity:.78;letter-spacing:.3px}
.ab-spacer{flex:1}
.ab-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;
  border-radius:9px;padding:7px 13px;font-size:12px;font-weight:700;display:inline-flex;
  align-items:center;gap:6px;transition:background .15s}
.ab-btn:hover{background:rgba(255,255,255,.28)}
.ab-btn svg{width:14px;height:14px}
.ab-who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
  border-radius:99px;padding:5px 12px 5px 5px;font-size:12px;font-weight:700}
.ab-av{width:26px;height:26px;border-radius:99px;background:#fff;color:var(--brand);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.sync-dot{width:8px;height:8px;border-radius:99px;background:#9AA1AC;flex:0 0 auto}
.sync-dot.on{background:#7BD9A8;box-shadow:0 0 0 3px rgba(123,217,168,.25)}
.sync-dot.err{background:#FFB4B4;box-shadow:0 0 0 3px rgba(255,180,180,.25)}

/* ── Shell ───────────────────────────────────────────────────── */
.shell{display:flex;min-height:calc(100vh - 58px)}
.side{width:218px;flex:0 0 218px;background:#fff;border-right:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.side-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--ink-2);background:none;border:none;
  width:100%;text-align:left;transition:background .14s,color .14s}
.nav svg{width:16px;height:16px;flex:0 0 auto;opacity:.72}
.nav:hover{background:var(--muted-bg)}
.nav.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:800}
.nav.on svg{opacity:1}
.nav .pill{margin-left:auto;background:var(--brand);color:#fff;border-radius:99px;
  font-size:10px;font-weight:800;padding:2px 7px;min-width:20px;text-align:center}
.nav.on .pill{background:var(--brand-deep)}
.main{flex:1;min-width:0;padding:20px 24px 60px}

/* ── Page furniture ──────────────────────────────────────────── */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:18px}
.page-t{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.2px}
.page-s{font-size:12.5px;color:var(--ink-3);margin-top:3px;max-width:62ch;line-height:1.5}
.btn{border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:700;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn:hover{background:var(--muted-bg)}
.btn svg{width:14px;height:14px}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.08);background:var(--brand)}
.btn-d{color:var(--risk);border-color:#E4B4BA}
.btn-d:hover{background:var(--risk);border-color:var(--risk);color:#fff}
.btn-sm{padding:6px 11px;font-size:11.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.card-t{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:9px}
.card-t .ico{width:26px;height:26px;border-radius:7px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center}
.card-t .ico svg{width:14px;height:14px}
.card-b{padding:16px}

/* ── KPI strip ───────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.kpi span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-top:4px}
.kpi.k-warn b{color:var(--warn)} .kpi.k-good b{color:var(--good)}
.kpi.k-risk b{color:var(--risk)} .kpi.k-info b{color:var(--info)}

/* ── Service launcher ────────────────────────────────────────── */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:13px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;
  text-align:left;box-shadow:var(--sh);transition:transform .16s,box-shadow .16s,border-color .16s;
  display:flex;flex-direction:column;gap:9px}
.svc:hover{transform:translateY(-2px);border-color:var(--brand);
  box-shadow:0 10px 26px -12px rgba(177,40,54,.4)}
.svc-ico{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center}
.svc-ico svg{width:19px;height:19px}
.svc-n{font-weight:800;font-size:14px}
.svc-d{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.svc-m{font-size:10.5px;font-weight:700;color:var(--brand);margin-top:auto;
  display:inline-flex;align-items:center;gap:5px}
.svc-m svg{width:12px;height:12px;flex:0 0 auto;stroke-width:2.6}
.svc{min-height:0}
/* any inline icon inside a button or chip inherits a sane size */
.btn svg,.vp-ico svg,.card-t .ico svg,.tl-nav svg{flex:0 0 auto}

/* ── Forms ───────────────────────────────────────────────────── */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.wide{grid-column:1/-1}
.fld>label{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld>label .req{color:var(--brand)}
.fld input,.fld select,.fld textarea{
  font-family:inherit;font-size:13px;color:var(--ink-2);background:#fff;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%}
.fld textarea{min-height:78px;resize:vertical;line-height:1.55}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.fld .hint{font-size:10.5px;color:var(--muted);line-height:1.5}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--risk);background:#FFFBFB}
.fld .err{font-size:10.5px;color:var(--risk);font-weight:700}
.form-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-top:15px;margin-top:16px;border-top:1px solid var(--line-soft)}
.form-foot .grow{flex:1}

/* ── Tables ──────────────────────────────────────────────────── */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;
  max-height:min(70vh,calc(100vh - 240px))}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.t thead th{position:sticky;top:0;z-index:2;background:#2E3138;color:#fff;
  font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:10px;text-align:left;white-space:nowrap;box-shadow:0 1px 0 rgba(16,24,40,.12)}
table.t tbody td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;background:#fff}
table.t tbody tr:nth-child(even) td{background:#FBFCFD}
table.t tbody tr:hover td{background:var(--brand-soft)}
table.t tbody tr:last-child td{border-bottom:none}
table.t .num{font-family:var(--mono);font-size:11.5px;text-align:right}
table.t .ref{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand-deep)}
.t-empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.t-empty b{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:5px}

/* ── Chips ───────────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;
  font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:99px;background:currentColor;flex:0 0 auto}
.c-new{background:var(--info-bg);color:var(--info)}
.c-ok{background:var(--good-bg);color:var(--good)}
.c-no{background:var(--risk-bg);color:var(--risk)}
.c-wait{background:var(--warn-bg);color:var(--warn)}
.c-done{background:var(--muted-bg);color:var(--muted-st)}
.c-hi{background:var(--risk-bg);color:var(--risk)}
.c-md{background:var(--warn-bg);color:var(--warn)}
.c-lo{background:var(--muted-bg);color:var(--muted-st)}

/* ── Filter bar ──────────────────────────────────────────────── */
.fbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;
  font-size:11.5px;font-weight:700;color:var(--ink-2)}
.fbtn:hover{background:var(--muted-bg)}
.fbtn.on{background:#2E3138;border-color:#2E3138;color:#fff}
.fsearch{margin-left:auto;position:relative}
.fsearch input{border:1px solid var(--line);border-radius:99px;padding:7px 13px 7px 32px;
  font-size:12px;width:210px;background:#fff}
.fsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--muted)}

/* ── Room timeline (signature element) ───────────────────────── */
.tl{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.tl-head{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.tl-date{font-weight:800;font-size:13px}
.tl-nav{display:flex;gap:5px}
.tl-body{overflow-x:auto}
.tl-grid{min-width:820px}
.tl-hours{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:#FAFBFD;z-index:2}
.tl-hours>div:first-child{padding:8px 12px;font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-right:1px solid var(--line-soft)}
.tl-hrs{display:grid}
.tl-hrs span{font-size:10px;font-weight:700;color:var(--muted);text-align:center;
  padding:8px 0;border-left:1px solid var(--line-soft);font-family:var(--mono)}
.tl-row{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line-soft)}
.tl-row:last-child{border-bottom:none}
.tl-room{padding:11px 12px;border-right:1px solid var(--line-soft);background:#FCFDFE}
.tl-room b{display:block;font-size:12.5px;font-weight:800}
.tl-room span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.tl-track{position:relative;min-height:52px;background-image:repeating-linear-gradient(
  90deg,transparent,transparent calc(100%/11 - 1px),var(--line-soft) calc(100%/11 - 1px),var(--line-soft) calc(100%/11))}
.tl-slot{position:absolute;top:7px;bottom:7px;border-radius:7px;padding:5px 9px;overflow:hidden;
  background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;line-height:1.3;
  box-shadow:0 2px 8px -3px rgba(177,40,54,.6);cursor:pointer;border:none;text-align:left}
.tl-slot{display:flex;flex-direction:column;justify-content:center}
.tl-slot>span,.tl-slot small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tl-slot small{font-weight:600;opacity:.85;font-size:9.5px}
.tl-slot.mine{background:var(--brand-deep)}
.tl-slot.virt{background:#41618A;box-shadow:0 2px 8px -3px rgba(65,97,138,.6)}
.tl-slot:hover{filter:brightness(1.12)}
.tl-free{position:absolute;inset:7px 0;display:grid;place-items:center;font-size:11px;color:var(--muted)}

/* ── Virtual room ────────────────────────────────────────────── */
.vr{display:grid;grid-template-columns:1fr 268px;gap:14px;align-items:start}
.vr-stage{background:#1A1D23;border-radius:var(--r);overflow:hidden;position:relative;min-height:420px}
.vr-share{width:100%;display:block;background:#000;max-height:62vh;object-fit:contain}
.vr-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#8A97A6}
.vr-empty b{display:block;color:#fff;font-size:15px;font-weight:800;margin-bottom:7px}
.vr-empty p{font-size:12px;line-height:1.65;max-width:44ch;margin:0 auto}
.vr-bar{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#22262E;flex-wrap:wrap}
.vr-btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;
  border-radius:9px;padding:8px 13px;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.vr-btn:hover{background:rgba(255,255,255,.2)}
.vr-btn svg{width:15px;height:15px}
.vr-btn.live{background:var(--brand);border-color:var(--brand)}
.vr-btn.off{background:#B0202E;border-color:#B0202E}
.vr-btn:disabled{opacity:.45;cursor:not-allowed}
.vr-side{display:flex;flex-direction:column;gap:12px}
.vr-people{max-height:330px;overflow-y:auto}
.vr-files{max-height:250px;overflow-y:auto}
.vf{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.vf:last-child{border-bottom:none}
.vf-icon{width:30px;height:30px;border-radius:8px;background:#EEF3FA;color:#41618A;
  display:grid;place-items:center;flex:0 0 auto}
.vf-icon svg{width:15px;height:15px}
.vf-main{min-width:0;flex:1}
.vf-name{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vf-meta{font-size:9.5px;color:var(--muted);font-weight:650;margin-top:2px}
.vf-get{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:7px;
  padding:5px 7px;display:grid;place-items:center}
.vf-get:hover{border-color:var(--brand);color:var(--brand)}
.vf-get svg{width:14px;height:14px}
.vp{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.vp:last-child{border-bottom:none}
.vp.meeting-entry{cursor:pointer;transition:background .15s ease,box-shadow .15s ease}
.vp.meeting-entry:hover,.vp.meeting-entry:focus{background:var(--brand-soft);outline:none;box-shadow:inset 3px 0 0 var(--brand)}
.vp-open{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--brand);font-size:11px;font-weight:800;white-space:nowrap}
.vp-open svg{width:14px;height:14px}
.vp-av{width:30px;height:30px;border-radius:99px;background:var(--brand-soft);color:var(--brand-deep);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 auto;position:relative}
.vp-av.talk{box-shadow:0 0 0 3px rgba(46,125,91,.4)}
.vp-n{font-size:12.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vp-r{font-size:10px;color:var(--muted);font-weight:700}
.vp-ico{margin-left:auto;display:flex;gap:5px;color:var(--muted)}
.vp-ico svg{width:14px;height:14px}
.vp-ico .mute{color:var(--risk)}
.vr-note{font-size:11px;color:var(--ink-3);line-height:1.6;background:#FAFBFD;
  border:1px solid var(--line-soft);border-radius:9px;padding:11px 12px}
.vr-note b{color:var(--ink-2)}

/* ── Toast ───────────────────────────────────────────────────── */
.toast{position:fixed;bottom:22px;right:22px;z-index:99999;max-width:400px;
  background:#20242E;color:#fff;padding:12px 16px;border-radius:10px;font-size:12.5px;
  font-weight:600;line-height:1.5;box-shadow:0 12px 34px rgba(0,0,0,.34);
  border-left:4px solid var(--good);opacity:0;transform:translateY(10px);
  transition:opacity .22s,transform .22s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-left-color:var(--risk)}

/* ── Modal ───────────────────────────────────────────────────── */
.mod{position:fixed;inset:0;z-index:9000;background:rgba(18,22,38,.52);
  display:flex;align-items:center;justify-content:center;padding:20px}
.mod-in{background:#fff;border-radius:14px;width:min(600px,96vw);max-height:92vh;overflow:auto;
  box-shadow:0 26px 74px rgba(18,22,38,.42)}
.mod-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:16px 20px;background:var(--brand);color:#fff}
.mod-t{font-weight:800;font-size:15.5px}
.mod-s{font-size:11.5px;opacity:.86;margin-top:2px}
.mod-x{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;
  border-radius:8px;font-size:14px;flex:0 0 auto}
.mod-x:hover{background:rgba(255,255,255,.34)}
.mod-b{padding:18px 20px}
.mod-f{display:flex;gap:10px;align-items:center;padding:14px 20px;
  border-top:1px solid var(--line);background:#FAFBFD}
.mod-f .grow{flex:1}

/* ── Detail rows ─────────────────────────────────────────────── */
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:12.5px}
.dl dt{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);padding-top:2px}
.dl dd{color:var(--ink-2);line-height:1.55}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cat-i{border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;
  align-items:center;gap:10px;background:#fff}
.cat-i b{font-size:12.5px}
.cat-i small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
.cat-i input{width:62px;margin-left:auto;text-align:center;border:1px solid var(--line);
  border-radius:7px;padding:5px;font-family:var(--mono);font-size:12px}
.cat-i.has{border-color:var(--brand);background:var(--brand-soft)}

<script>

/* ═══════════════════════════════════════════════════════════════════════════

   A separate portal from the projects dashboard. It shares the visual system
   and the sync approach, but NOT the data: this writes to its own Firebase
   room and never touches portals/asimati-hub-v2.
   ═══════════════════════════════════════════════════════════════════════════ */

var SK='kp_services_v1';
var ROOM_DEFAULT='asimati-services';
var PORTAL_BUILD='2026.08.26.23';
/* Meeting invitations must open the standalone hosted page. Loading the hub
   through an iframe/srcdoc gives it an about: URL, which is confusing for

var PUBLIC_PORTAL_URL='https://knowledge-papers.web.app/services_portal.html?v=23';

   so the portal asks for only the narrower Calendar event permission. */
var GOOGLE_OAUTH_SCOPES=GOOGLE_CALENDAR_SCOPE;
var GOOGLE_CALENDAR_API_URL='https://www.googleapis.com/calendar/v3/calendars/primary/events';
/* Google access tokens are deliberately kept only in page memory. They are

var GOOGLE_MEET_TOKEN_EXPIRES=0;

   mesh. The token endpoint returns a short-lived participant token and the

var LIVEKIT_TOKEN_ENDPOINT='https://me-central1-knowledge-papers.cloudfunctions.net/livekitToken';
var LIVEKIT_SDK_URL='https://cdn.jsdelivr.net/npm/livekit-client@2.22.0/dist/livekit-client.umd.min.js';
var FIREBASE_DEFAULT={
  databaseURL:'https://knowledge-papers-default-rtdb.firebaseio.com',
  projectId:'knowledge-papers',
  authDomain:'knowledge-papers.firebaseapp.com',
  storageBucket:'knowledge-papers.firebasestorage.app',
  messagingSenderId:'602139029671',
  appId:'1:602139029671:web:9570a577b2a7302cc82b82'
};
/* Interface-level Admin access. The code is stored as a SHA-256 digest rather
   than clear text. Firebase Authentication + database rules remain the proper
   security boundary when the production database is locked down. */
var ADMIN_ACCESS_HASH='5ec3fcc1e59062c83809dd9934245d1507fff6640033fb126958b3ba41c1187f';
var ADMIN_SESSION_KEY='kp_services_admin_ok';
var HUB_ACCESS_HASH='79f06f8fde333461739f220090a23cb2a79f6d714bee100d0e4b4af249294619';
var HUB_SESSION_KEY='kp_workplace_hub_ok';

/* ── State ───────────────────────────────────────────────────────────────── */
var STORE=null, ME=null, VIEW='home', FILTER='open', SEARCH='';
var TLDATE=todayISO();
var PORTAL_LINK=null;
var APPROVAL_TYPE_KEYS=['car','room','stationery','it','warehouse','custom','official'];
var APPROVAL_TYPE_LABELS={car:'Vehicle requests',room:'Meeting rooms',stationery:'Stationery',it:'IT support',warehouse:'Warehouse',custom:'Additional services',official:'Official correspondence (GR)'};

function normalisePersonPermissions(p){
  if(!p.permissions||typeof p.permissions!=='object')p.permissions={};
  if(p.permissions.canRequest==null)p.permissions.canRequest=true;
  if(p.permissions.canCallMeetings==null)p.permissions.canCallMeetings=true;
  /* Admin access and approval responsibility are separate. An Admin may
     manage every route without being inserted into every request. */
  if(p.permissions.canApprove==null)p.permissions.canApprove=(+p.approvalLevel||0)>0||p.role==='approver';
  if(!Array.isArray(p.approvalTypes))p.approvalTypes=(+p.approvalLevel||0)>0?APPROVAL_TYPE_KEYS.slice():[];
}
function normaliseApproverTypes(p){
  if(!Array.isArray(p.approvalTypes))p.approvalTypes=(+p.approvalLevel||0)>0?APPROVAL_TYPE_KEYS.slice():[];
  p.approvalTypes=p.approvalTypes.filter(function(x){return APPROVAL_TYPE_KEYS.indexOf(x)>=0;});
}

function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(d){
  if(!d) return '—';
  try{ return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',
    timeZone:'Asia/Baghdad'}).format(new Date(d)); }catch(e){ return d; }
}
function fmtTime(d){
  if(!d) return '';
  try{ return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',
    timeZone:'Asia/Baghdad'}).format(new Date(d)); }catch(e){ return ''; }
}
function fmtWhen(d){ return d?(fmtDate(d)+' · '+fmtTime(d)):'—'; }
function initials(n){
  return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase()||'?';
}
function toast(msg,ok){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show'+(ok===false?' err':'');
  clearTimeout(el._t); el._t=setTimeout(function(){ el.className='toast'; },3600);
}

/* ── Seed: structure only, no fake request history ───────────────────────
   Rooms, vehicles and catalogues are reference data the portal cannot work
   without. Requests start empty — inventing a request history would put
   fictional names and approvals in front of real staff. */
function seed(){
  return {
    v:1,
    settings:{turn:{urls:'',username:'',credential:''}},
    people:[],
    contacts:[],
    resourceDirectory:[],
    announcements:[],
    auditLog:[],
    services:[],
    requests:[],
    bookings:[],
    vrooms:[],
    rooms:[
      {id:'rm1',name:'Board Room',      capacity:14,location:'Floor 3 · East',  features:['Projector','Video conference','Whiteboard']},
      {id:'rm2',name:'Majlis Room',     capacity:8, location:'Floor 2 · West',  features:['TV screen','Whiteboard']},
      {id:'rm3',name:'Training Room',   capacity:24,location:'Floor 1 · North', features:['Projector','Sound system']},
      {id:'rm4',name:'Huddle 1',        capacity:4, location:'Floor 2 · East',  features:['TV screen']},
      {id:'rm5',name:'Huddle 2',        capacity:4, location:'Floor 3 · West',  features:['TV screen']}
    ],
    fleet:[
      {id:'v1',plate:'BGD 21473',model:'Toyota Land Cruiser',type:'SUV',   seats:7,driver:'Assigned on approval',status:'available'},
      {id:'v2',plate:'BGD 30918',model:'Toyota Hilux',       type:'Pickup',seats:5,driver:'Assigned on approval',status:'available'},
      {id:'v3',plate:'BGD 11256',model:'Hyundai Staria',     type:'Van',   seats:11,driver:'Assigned on approval',status:'available'},
      {id:'v4',plate:'BGD 44802',model:'Toyota Corolla',     type:'Sedan', seats:5,driver:'Self-drive permitted',  status:'available'},
      {id:'v5',plate:'BGD 55317',model:'Nissan Patrol',      type:'SUV',   seats:7,driver:'Assigned on approval',status:'maintenance'}
    ],
    catalog:{
      stationery:[
        {id:'s1',name:'A4 paper',unit:'ream'},{id:'s2',name:'Ballpoint pens',unit:'box of 12'},
        {id:'s3',name:'Whiteboard markers',unit:'set of 4'},{id:'s4',name:'Notebooks A5',unit:'each'},
        {id:'s5',name:'Box files',unit:'each'},{id:'s6',name:'Sticky notes',unit:'pack'},
        {id:'s7',name:'Stapler + pins',unit:'set'},{id:'s8',name:'Document wallets',unit:'pack of 25'},
        {id:'s9',name:'Printer toner',unit:'cartridge'},{id:'s10',name:'Desk organiser',unit:'each'}
      ],
      it:[
        {id:'i1',name:'Laptop',unit:'unit'},{id:'i2',name:'Desktop workstation',unit:'unit'},
        {id:'i3',name:'Monitor 24"',unit:'unit'},{id:'i4',name:'Keyboard + mouse',unit:'set'},
        {id:'i5',name:'Headset',unit:'unit'},{id:'i6',name:'Docking station',unit:'unit'},
        {id:'i7',name:'Network cable',unit:'each'},{id:'i8',name:'Tablet',unit:'unit'}
      ],
      warehouse:[
        {id:'w1',name:'Network switch 24-port',unit:'unit'},{id:'w2',name:'Fibre patch cord',unit:'each'},
        {id:'w3',name:'Rack shelf',unit:'each'},{id:'w4',name:'UPS 3kVA',unit:'unit'},
        {id:'w5',name:'Cable tray 2m',unit:'length'},{id:'w6',name:'RJ45 connectors',unit:'bag of 100'},
        {id:'w7',name:'Safety helmet',unit:'each'},{id:'w8',name:'Hi-vis vest',unit:'each'},
        {id:'w9',name:'Tool kit',unit:'set'},{id:'w10',name:'Padlock',unit:'each'}
      ]
    }
  };
}

/* ── Persistence ─────────────────────────────────────────────────────────── */
function load(){
  try{
    var raw=localStorage.getItem(SK);
    if(raw){
      var o=JSON.parse(raw);
      if(o&&o.v){ STORE=o; normalise(); return; }
    }
  }catch(e){ console.warn('local load failed',e); }
  STORE=seed();
}
function normalise(){
  var s=seed();
  if(!STORE.settings||typeof STORE.settings!=='object') STORE.settings=s.settings;
  if(!STORE.settings.turn||typeof STORE.settings.turn!=='object') STORE.settings.turn=s.settings.turn;
  ['people','contacts','resourceDirectory','announcements','auditLog','services','requests','bookings','vrooms','rooms','fleet'].forEach(function(k){
    if(!Array.isArray(STORE[k])) STORE[k]=s[k];
  });
  if(!STORE.catalog) STORE.catalog=s.catalog;
  ['stationery','it','warehouse'].forEach(function(k){
    if(!Array.isArray(STORE.catalog[k])) STORE.catalog[k]=s.catalog[k];
  });
  STORE.people.forEach(function(p){
    if(!p.role) p.role='requester';
    if(p.email==null) p.email='';
    if(p.phone==null) p.phone='';
    if(p.approvalLevel==null) p.approvalLevel=(p.role==='approver'||p.role==='admin')?1:0;
    p.approvalLevel=Math.max(0,Math.min(5,+p.approvalLevel||0));
    normalisePersonPermissions(p);normaliseApproverTypes(p);
  });
  STORE.contacts.forEach(function(c){
    if(c.email==null) c.email='';
    if(c.phone==null) c.phone='';
    if(c.dept==null) c.dept='';
    if(c.title==null) c.title='';
    if(c.approvalLevel==null) c.approvalLevel=c.canApprove?1:0;
    c.approvalLevel=Math.max(0,Math.min(5,+c.approvalLevel||0));
    c.canApprove=c.approvalLevel>0;
    normaliseApproverTypes(c);
  });
  mergeResourceDirectory();
  STORE.announcements.forEach(function(a){
    if(a.active==null)a.active=true;
    if(!a.priority)a.priority='normal';
    if(!a.audience)a.audience='all';
    if(!a.readBy||typeof a.readBy!=='object')a.readBy={};
  });
  STORE.services.forEach(function(sv){
    if(sv.name==null) sv.name='Service';
    if(sv.description==null) sv.description='Submit a request to the responsible team.';
    if(sv.active==null) sv.active=true;
  });
  STORE.requests.forEach(function(r){
    if(!Array.isArray(r.approvals)) r.approvals=[];
    r.approvals.forEach(function(a){if(!a.status)a.status='pending';if(a.level==null)a.level=1;a.level=Math.max(1,Math.min(5,+a.level||1));});
  });
  STORE.bookings.forEach(function(b){

    if(!Array.isArray(b.emails)) b.emails=[];

async function sha256Hex(s){
  if(!(window.crypto&&crypto.subtle)) return '';
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s||'')));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}

/* ── Request pipeline ────────────────────────────────────────────────────
   Every service writes into one requests[] array with a shared lifecycle, so
   approvals, search and export work identically across all of them. */
var TYPES={
  car:       {label:'Vehicle',    ref:'CAR', ico:'car'},
  room:      {label:'Meeting room',ref:'RM', ico:'door'},
  stationery:{label:'Stationery', ref:'STN', ico:'pen'},
  it:        {label:'IT support', ref:'IT',  ico:'chip'},
  warehouse: {label:'Warehouse',  ref:'WH',  ico:'box'},
  custom:    {label:'Service request',ref:'SRV',ico:'list'}
};
var STATUS={
  submitted:{label:'Submitted',cls:'c-new'},
  approved: {label:'Approved', cls:'c-ok'},
  declined: {label:'Declined', cls:'c-no'},
  fulfilled:{label:'Fulfilled',cls:'c-done'},
  cancelled:{label:'Cancelled',cls:'c-done'}
};
var PRIO={high:{label:'High',cls:'c-hi'},medium:{label:'Medium',cls:'c-md'},low:{label:'Low',cls:'c-lo'}};

function nextRef(type){
  var pre=(TYPES[type]||TYPES.custom).ref;
  var n=STORE.requests.filter(function(r){ return r.type===type; }).length+1;
  return pre+'-'+String(n).padStart(4,'0');
}
function requestTypeMeta(r){
  if(!r)return TYPES.custom;
  if(r.type!=='custom')return TYPES[r.type]||TYPES.custom;
  var d=r.details||{},sv=(STORE.services||[]).find(function(x){return x.id===d.serviceId;});
  return {label:d.serviceName||(sv&&sv.name)||TYPES.custom.label,ref:'SRV',ico:'list'};
}
function requestTypeLabel(r){return requestTypeMeta(r).label;}
function submitRequest(type,payload,priority,needed,note,approvals){
  var r={
    id:uid('r'), ref:nextRef(type), type:type,
    by:ME.name, byId:ME.id, dept:ME.dept,
    status:'submitted', priority:priority||'medium',
    created:nowISO(), needed:needed||'', note:note||'',
    approvals:(approvals||[]).map(function(a){return {id:a.id,name:a.name,email:a.email||'',level:Math.max(1,+a.level||1),status:'pending',decidedAt:'',decision:''};})
      .sort(function(a,b){return a.level-b.level||a.name.localeCompare(b.name);}),
    details:payload, history:[{at:nowISO(),who:ME.name,what:'Submitted'}]
  };
  STORE.requests.unshift(r);
  auditRecord('create','request',r.id,r.ref+' · '+requestTypeLabel(r));
  save();
  return r;
}
function activeApprovalLevel(r){
  var pending=(r.approvals||[]).filter(function(a){return (a.status||'pending')==='pending';});
  return pending.length?Math.min.apply(Math,pending.map(function(a){return Math.max(1,+a.level||1);})):0;
}
function decide(id,status,reason){
  var r=STORE.requests.find(function(x){ return x.id===id; });
  if(!r) return;
  var chain=r.approvals||[], pending=chain.filter(function(a){return a.status==='pending';});
  if((status==='approved'||status==='declined')&&chain.length){
    var level=activeApprovalLevel(r),active=pending.filter(function(a){return Math.max(1,+a.level||1)===level;});
    var mine=active.filter(function(a){return a.id===(ME&&ME.id)||sameEmail(a.email,ME&&ME.email);});
    if(!isAdmin()&&!mine.length){toast('This request is waiting for Approval Level '+level,false);return;}
    var targets=isAdmin()?active:[mine[0]];
    targets.forEach(function(a){a.status=status;a.decidedAt=nowISO();a.decision=reason||'';a.decidedBy=ME?ME.name:'';});
    if(status==='declined') r.status='declined';
    else r.status=chain.every(function(a){return a.status==='approved';})?'approved':'submitted';
  }else r.status=status;
  r.decidedAt=nowISO(); r.decidedBy=ME?ME.name:'';
  if(reason) r.decision=reason;
  r.history.push({at:nowISO(),who:ME?ME.name:'',what:STATUS[status].label+((status==='approved'||status==='declined')&&chain.length?(' · Level '+(level||1)):'')+(reason?(' — '+reason):'')});
  auditRecord(status==='approved'?'approve':(status==='declined'?'decline':(status==='fulfilled'?'fulfill':'update')),'request',r.id,r.ref+(reason?' · '+reason:''));
  save(); render();
  if(status==='approved'&&r.status==='submitted'){
    var done=chain.filter(function(a){return a.status==='approved';}).length;
    toast('Your approval was recorded · '+done+'/'+chain.length+' complete',true);
  }else toast('Request '+r.ref+' '+STATUS[status].label.toLowerCase(),status!=='declined');
}
function openRequests(){ return STORE.requests.filter(function(r){ return r.status==='submitted'; }); }
function canApproveRequest(r){
  if(!ME||r.status!=='submitted') return false;
  if(isAdmin()) return true;
  var chain=r.approvals||[];
  if(!chain.length) return isApprover();
  var level=activeApprovalLevel(r);
  return chain.some(function(a){return a.status==='pending'&&Math.max(1,+a.level||1)===level&&(a.id===ME.id||sameEmail(a.email,ME.email));});
}
function myApprovalRequests(){return openRequests().filter(canApproveRequest);}
function myRequests(){ return ME?STORE.requests.filter(function(r){ return r.byId===ME.id; }):[]; }

/* ── Meeting rooms + timeline ────────────────────────────────────────────── */
var TL_START=8, TL_END=19;
function vRooms(){
  var d=TLDATE;
  var hrs=[]; for(var h=TL_START;h<=TL_END;h++) hrs.push(h);
  var head='<div class="tl-hours"><div>Room</div><div class="tl-hrs" style="grid-template-columns:repeat('
    +(TL_END-TL_START)+',1fr)">'
    +hrs.slice(0,-1).map(function(h){ return '<span>'+String(h).padStart(2,'0')+':00</span>'; }).join('')
    +'</div></div>';

  var rows=STORE.rooms.map(function(rm){
    var bs=STORE.bookings.filter(function(b){ return b.roomId===rm.id && b.date===d; });
    var slots=bs.map(function(b){
      var s=toMin(b.start), e=toMin(b.end);
      var L=((s-TL_START*60)/((TL_END-TL_START)*60))*100;
      var W=((e-s)/((TL_END-TL_START)*60))*100;
      if(L<0){ W+=L; L=0; } if(L+W>100) W=100-L;
      if(W<=0) return '';
      return '<button class="tl-slot'+(b.by===(ME&&ME.name)?' mine':'')+(b.virtual?' virt':'')+'" '
        +'style="left:'+L+'%;width:'+W+'%" onclick="openBooking(\''+b.id+'\')" '
        +'title="'+esc(b.title)+' — '+esc(b.by)+'">'+esc(b.title)
        +'<small>'+esc(b.start)+'\u2013'+esc(b.end)+' \u00b7 '+esc(b.by)+'</small></button>';
    }).join('');
    return '<div class="tl-row"><div class="tl-room"><b>'+esc(rm.name)+'</b>'
      +'<span>'+rm.capacity+' seats \u00b7 '+esc(rm.location)+'</span></div>'
      +'<div class="tl-track" onclick="quickBook(event,\''+rm.id+'\')" title="Click an empty slot to book this room">'
      +(slots||'<div class="tl-free">Free all day \u2014 click to book</div>')+'</div></div>';
  }).join('');

  return pageHead('Meeting rooms',
      'A live view of every room. Click any empty stretch to take that slot.',
      '<button class="btn btn-p" onclick="go(\'meet\')">'+ico('plus')+'Call a meeting</button>')
    +'<div class="tl"><div class="tl-head">'
      +'<div class="tl-date">'+fmtDate(d)+'</div>'
      +'<div class="tl-nav"><button class="btn btn-sm" onclick="shiftDay(-1)">\u2190 Previous</button>'
      +'<button class="btn btn-sm" onclick="setDay(\''+todayISO()+'\')">Today</button>'
      +'<button class="btn btn-sm" onclick="shiftDay(1)">Next \u2192</button></div>'
      +'<input type="date" value="'+d+'" onchange="setDay(this.value)" '
        +'style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px">'
      +'<div style="margin-left:auto;font-size:11px;color:var(--muted)">'
        +'<span class="chip c-done" style="background:var(--brand);color:#fff"><i></i>Booked</span> '
        +'<span class="chip c-done" style="background:#41618A;color:#fff"><i></i>Has an online room</span></div>'
    +'</div><div class="tl-body"><div class="tl-grid">'+head+rows+'</div></div></div>';
}
function toMin(t){ var p=String(t||'0:0').split(':'); return (+p[0]||0)*60+(+p[1]||0); }
function toHHMM(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function setDay(d){ if(d){ TLDATE=d; render(); } }
function shiftDay(n){
  var d=new Date(TLDATE+'T00:00:00'); d.setDate(d.getDate()+n);
  TLDATE=d.toISOString().slice(0,10); render();
}
function quickBook(ev,roomId){
  if(ev.target.closest('.tl-slot')) return;
  if(!needMe()) return;
  var tr=ev.currentTarget.getBoundingClientRect();
  var pct=(ev.clientX-tr.left)/tr.width;
  var mins=TL_START*60+pct*(TL_END-TL_START)*60;
  var start=Math.max(TL_START*60,Math.round(mins/30)*30);
  MEET_PRE={roomId:roomId,date:TLDATE,start:toHHMM(start),end:toHHMM(Math.min(TL_END*60,start+60))};
  go('meet');
}
var MEET_PRE=null;
function splitList(s){
  return String(s||'').split(/[\n,;]+/).map(function(x){return x.trim();}).filter(Boolean);
}
function uniqueList(a){
  var seen={};return (a||[]).filter(function(x){var k=String(x||'').trim().toLowerCase();if(!k||seen[k])return false;seen[k]=1;return true;});
}
function directoryContacts(){
  var out=(STORE.contacts||[]).map(function(c){return Object.assign({source:'directory'},c);}),seen={};
  out.forEach(function(c){
    c.approvalLevel=Math.max(0,+c.approvalLevel||(c.canApprove?1:0));c.canApprove=c.approvalLevel>0;
    normaliseApproverTypes(c);
    if(c.email)seen[c.email.toLowerCase()]=c;
  });
  (STORE.people||[]).forEach(function(p){
    normalisePersonPermissions(p);normaliseApproverTypes(p);
    var level=Math.max(0,+p.approvalLevel||0),assigned=p.permissions.canApprove!==false&&level>0&&(p.approvalTypes||[]).length>0,
        existing=p.email&&seen[p.email.toLowerCase()];
    if(existing){
      if(assigned){
        existing.approvalLevel=Math.max(existing.approvalLevel||0,level);existing.canApprove=true;
        existing.approvalTypes=uniqueList((existing.approvalTypes||[]).concat(p.approvalTypes||[]));
      }
      if(!existing.phone)existing.phone=p.phone||'';if(!existing.title)existing.title=roleName(p.role);return;
    }
    out.push({id:p.id,name:p.name,email:p.email||'',phone:p.phone||'',dept:p.dept||'',title:roleName(p.role),
      approvalLevel:level,canApprove:assigned,approvalTypes:(p.approvalTypes||[]).slice(),source:'user'});
    if(p.email)seen[p.email.toLowerCase()]=out[out.length-1];
  });
  return out.sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));});
}
function findDirectoryContact(id){return directoryContacts().find(function(c){return c.id===id;});}
function directoryPicker(prefix,selected){
  var all=directoryContacts(),sel={};(selected||[]).forEach(function(id){sel[id]=1;});
  if(!all.length)return '<div class="dir-pick"><div class="t-empty" style="padding:18px"><b>Company Directory is empty</b>'
    +(isAdmin()?'Add employees from Admin centre.':'Ask Admin to add company employees and emails.')+'</div></div>';
  return '<div class="dir-pick"><div class="dir-select"><select onchange="chooseDirectoryContact(this,\''+prefix+'\')">'
    +'<option value="">Choose an employee from the dropdown…</option>'
    +all.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+(c.dept?' · '+esc(c.dept):'')+(c.email?' · '+esc(c.email):'')+'</option>';}).join('')
    +'</select></div><div class="dir-search"><input placeholder="Or search company name, department or email" '
    +'oninput="filterDirectory(this.value,\''+prefix+'\')"></div><div class="dir-list" id="'+prefix+'DirList">'
    +all.map(function(c){return '<label class="dir-row" data-search="'+esc((c.name+' '+c.dept+' '+c.email).toLowerCase())+'">'
      +'<input type="checkbox" class="dir-contact" data-prefix="'+prefix+'" value="'+esc(c.id)+'" '
      +(sel[c.id]?'checked ':'')+'onchange="pickDirectoryContact(this,\''+prefix+'\')">'
      +'<span><b>'+esc(c.name)+'</b><small>'+esc([c.dept,c.title,c.email].filter(Boolean).join(' · '))+'</small></span></label>';}).join('')
    +'</div></div>';
}
function filterDirectory(q,prefix){
  q=String(q||'').toLowerCase();var host=document.getElementById(prefix+'DirList');if(!host)return;
  host.querySelectorAll('.dir-row').forEach(function(r){r.style.display=!q||r.dataset.search.indexOf(q)>=0?'flex':'none';});
}
function chooseDirectoryContact(sel,prefix){
  var id=sel.value;if(!id)return;
  var box=Array.from(document.querySelectorAll('.dir-contact[data-prefix="'+prefix+'"]')).find(function(x){return x.value===id;});
  if(box&&!box.checked){box.checked=true;pickDirectoryContact(box,prefix);}
  sel.value='';
}
function setListField(id,items){var e=document.getElementById(id);if(e)e.value=uniqueList(items).join(', ');}
function pickDirectoryContact(inp,prefix){
  var c=findDirectoryContact(inp.value);if(!c)return;
  var ids={m:['mWho','mEmails','mPhones'],e:['eWho','eEmails','ePhones']}[prefix];if(!ids)return;
  [[ids[0],c.name],[ids[1],c.email],[ids[2],c.phone]].forEach(function(x){
    if(!x[1])return;var a=splitList(val(x[0]));if(inp.checked)a.push(x[1]);else a=a.filter(function(v){return v.toLowerCase()!==String(x[1]).toLowerCase();});setListField(x[0],a);
  });
}
function selectedDirectoryIds(prefix){
  return Array.from(document.querySelectorAll('.dir-contact[data-prefix="'+prefix+'"]:checked')).map(function(x){return x.value;});
}
function approvalContacts(){return directoryContacts().filter(function(c){return !!c.canApprove;}).sort(function(a,b){
  return (+a.approvalLevel||1)-(+b.approvalLevel||1)||String(a.name||'').localeCompare(String(b.name||''));
});}
function automaticApprovers(type){
  return approvalContacts().filter(function(c){return (c.approvalTypes||[]).indexOf(type)>=0;}).map(function(c){
    return {id:c.id,name:c.name,email:c.email||'',level:Math.max(1,+c.approvalLevel||1)};
  }).sort(function(a,b){return a.level-b.level||a.name.localeCompare(b.name);});
}
function approvalRouteSummary(type){
  var all=automaticApprovers(type),label=APPROVAL_TYPE_LABELS[type]||'this service';
  if(!all.length)return '<div class="appr-pick"><label>Approval owner — Admin controlled</label><div style="font-size:12px;color:var(--warn)"><b>No approver configured for '+esc(label)+'.</b> Admin must assign one from Company Directory & Approvals.</div></div>';
  return '<div class="appr-pick"><label>Approval owner — assigned automatically by Admin</label><div class="appr-options">'

    +'<div style="font-size:10.5px;color:var(--muted);margin-top:8px">No requester selection is needed. Admin controls the people, services and approval order.</div></div>';
}
function requireAutomaticApprovers(type){
  var a=automaticApprovers(type);if(!a.length){toast('Admin must assign an approver for '+(APPROVAL_TYPE_LABELS[type]||'this service')+' in Company Directory & Approvals',false);return null;}return a;

function approverPicker(prefix,selected){

/* ── Google Meet OAuth (per organiser) ──────────────────────────────────── */
function requestGoogleMeetAccessToken(){
  if(GOOGLE_MEET_TOKEN&&Date.now()<GOOGLE_MEET_TOKEN_EXPIRES-60000){
    return Promise.resolve(GOOGLE_MEET_TOKEN);
  }
  return new Promise(function(resolve,reject){
    if(!window.google||!google.accounts||!google.accounts.oauth2){
      reject(new Error('Google sign-in is still loading. Check the internet connection and try again.'));
      return;
    }
    var settled=false;
    var timer=setTimeout(function(){
      if(!settled){settled=true;reject(new Error('Google sign-in timed out. Please try again.'));}
    },120000);
    function finish(fn,value){
      if(settled)return;settled=true;clearTimeout(timer);fn(value);
    }
    try{
      var client=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_OAUTH_CLIENT_ID,
        scope:GOOGLE_OAUTH_SCOPES,
        callback:function(response){
          if(!response||response.error||!response.access_token){
            finish(reject,new Error((response&&response.error_description)||
              (response&&response.error)||'Google authorization was not completed.'));
            return;
          }
          if(google.accounts.oauth2.hasGrantedAllScopes&&
             !google.accounts.oauth2.hasGrantedAllScopes(response,GOOGLE_CALENDAR_SCOPE)){
            finish(reject,new Error('Permission to create the calendar invitation and Google Meet link was not granted.'));
            return;
          }
          GOOGLE_MEET_TOKEN=response.access_token;
          GOOGLE_MEET_TOKEN_EXPIRES=Date.now()+(Math.max(60,+response.expires_in||3600)*1000);
          finish(resolve,GOOGLE_MEET_TOKEN);
        },
        error_callback:function(error){
          var kind=(error&&error.type)||'Google sign-in was closed.';
          finish(reject,new Error(kind));
        }
      });
      client.requestAccessToken();
    }catch(error){finish(reject,error);}
  });
}
function calendarDateTime(date,time){return String(date||'')+'T'+String(time||'00:00')+':00+03:00';}
function validInviteEmails(items){
  return uniqueList(items||[]).filter(function(x){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(x||'').trim());});
}
function calendarMeetLink(event){
  if(event&&event.hangoutLink)return event.hangoutLink;
  var ep=event&&event.conferenceData&&event.conferenceData.entryPoints||[];
  var video=ep.find(function(x){return x.entryPointType==='video';});return video&&video.uri||'';
}
function calendarEventPayload(info,conferenceMode){
  var body={
    summary:info.title,
    description:(info.agenda||'')+'\n\nCreated through Knowledge Papers Work Place Hub.',
    location:info.location||'',
    start:{dateTime:calendarDateTime(info.date,info.from),timeZone:'Asia/Baghdad'},
    end:{dateTime:calendarDateTime(info.date,info.to),timeZone:'Asia/Baghdad'},
    attendees:validInviteEmails(info.emails).map(function(email){return {email:email};}),
    guestsCanInviteOthers:false,
    guestsCanModify:false,
    guestsCanSeeOtherGuests:true
  };
  if(info.virtual&&conferenceMode==='create')body.conferenceData={createRequest:{requestId:'kp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),conferenceSolutionKey:{type:'hangoutsMeet'}}};
  if(!info.virtual&&conferenceMode==='remove')body.conferenceData=null;
  return body;
}
async function createGoogleMeetSpace(info){
  var token=await requestGoogleMeetAccessToken();
  var response=await fetch(GOOGLE_CALENDAR_API_URL+'?conferenceDataVersion=1&sendUpdates=all',{
    method:'POST',
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(calendarEventPayload(info||{},info&&info.virtual?'create':'preserve'))
  });
  var textBody=await response.text(),data={};
  try{data=textBody?JSON.parse(textBody):{};}catch(ignore){}
  if(!response.ok){
    if(response.status===401){GOOGLE_MEET_TOKEN='';GOOGLE_MEET_TOKEN_EXPIRES=0;}
    var detail=data&&data.error&&data.error.message?data.error.message:('HTTP '+response.status);
    throw new Error(detail);
  }
  var meetUri=calendarMeetLink(data);
  if(info&&info.virtual&&!meetUri)throw new Error('Google created the calendar event without a Meet link. Please try again.');
  return {name:data.id||'',meetingUri:meetUri,meetingCode:'',calendarEventId:data.id||'',calendarHtmlLink:data.htmlLink||'',calendarOrganizer:(data.organizer&&data.organizer.email)||'',raw:data};
}
async function updateGoogleCalendarEvent(booking,info){
  if(!booking||!booking.calendarEventId)return null;
  var token=await requestGoogleMeetAccessToken();
  var url=GOOGLE_CALENDAR_API_URL+'/'+encodeURIComponent(booking.calendarEventId)+'?conferenceDataVersion=1&sendUpdates=all';
  var mode=info&&info.virtual?(booking.meetUri?'preserve':'create'):(booking.meetUri?'remove':'preserve');
  var response=await fetch(url,{method:'PATCH',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(calendarEventPayload(info||{},mode))});
  var textBody=await response.text(),data={};try{data=textBody?JSON.parse(textBody):{};}catch(ignore){}
  if(!response.ok){if(response.status===401){GOOGLE_MEET_TOKEN='';GOOGLE_MEET_TOKEN_EXPIRES=0;}throw new Error(data&&data.error&&data.error.message||('HTTP '+response.status));}
  return data;
}
async function deleteGoogleCalendarEvent(booking){
  if(!booking||!booking.calendarEventId)return true;
  var token=await requestGoogleMeetAccessToken();
  var response=await fetch(GOOGLE_CALENDAR_API_URL+'/'+encodeURIComponent(booking.calendarEventId)+'?sendUpdates=all',{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
  if(response.status===204||response.ok)return true;
  var data={};try{data=JSON.parse(await response.text());}catch(ignore){}
  if(response.status===401){GOOGLE_MEET_TOKEN='';GOOGLE_MEET_TOKEN_EXPIRES=0;}
  throw new Error(data&&data.error&&data.error.message||('HTTP '+response.status));
}
function googleMeetErrorText(error){
  var msg=String(error&&error.message||error||'Unknown error');
  if(/popup_closed|closed/i.test(msg))return 'Google sign-in was closed. Click Create & Send Invitation and choose your Google account.';
  if(/popup_failed|popup.*open/i.test(msg))return 'The Google sign-in window was blocked. Allow pop-ups for this portal and try again.';
  if(/access_denied|not.*test|permission|eligible|403/i.test(msg))return 'This Google account is not allowed yet. While the app is in Testing, Admin must add its Gmail address as an OAuth test user.';
  if(/origin|redirect_uri_mismatch/i.test(msg))return 'This website address is not authorized in the Google OAuth client. Ask Admin to check the authorized JavaScript origins.';
  if(/calendar.*api.*disabled|access not configured|has not been used/i.test(msg))return 'Google Calendar API is not enabled for this project. Admin must enable it in Google Cloud, then try again.';
  return 'Google Calendar invitation could not be created: '+msg;
}

function syncMeetingRequest(b){
  var r=b.requestId?STORE.requests.find(function(x){return x.id===b.requestId;}):null;
  if(!r&&b.roomId){
    r={id:uid('r'),ref:nextRef('room'),type:'room',by:b.by,byId:b.byId,dept:b.dept||'',
      status:'submitted',priority:'medium',created:nowISO(),needed:b.date+' '+b.start,note:b.agenda||'',
      details:{},history:[{at:nowISO(),who:ME?ME.name:b.by,what:'Created from meeting booking'}]};
    STORE.requests.unshift(r); b.requestId=r.id;
  }
  if(!r) return;
  if(!b.roomId){
    r.status='cancelled';
    r.history=(r.history||[]).concat([{at:nowISO(),who:ME?ME.name:'',what:'Room removed from meeting'}]);
    return;
  }
  r.by=b.by; r.byId=b.byId; r.dept=b.dept||''; r.needed=b.date+' '+b.start; r.note=b.agenda||'';
  r.details={title:b.title,date:b.date,from:b.start,to:b.end,room:meetingRoomName(b).split(' · ')[0],
    attendees:(b.attendees||[]).length,agenda:b.agenda||'',bookingId:b.id};
  r.history=(r.history||[]).concat([{at:nowISO(),who:ME?ME.name:'',what:'Meeting details updated'}]);
}
function editMeeting(id){
  var b=STORE.bookings.find(function(x){return x.id===id;}); if(!b) return;
  if(!(isAdmin()||(ME&&b.byId===ME.id))){ toast('Only the organiser or Admin can edit this meeting',false); return; }
  var m=document.createElement('div'); m.className='mod';
  m.innerHTML='<div class="mod-in"><div class="mod-h"><div><div class="mod-t">Edit meeting</div>'
    +'<div class="mod-s">Update the room, time, contacts or agenda</div></div><button class="mod-x" id="ex">&times;</button></div>'
    +'<div class="mod-b"><div class="form">'
    +fld('eT','Title <span class="req">*</span>','<input id="eT" value="'+esc(b.title)+'">','',true)
    +fld('eDate','Date','<input id="eDate" type="date" value="'+esc(b.date)+'">')
    +fld('eRoom','Room','<select id="eRoom"><option value="">No room — virtual only</option>'
      +STORE.rooms.map(function(r){return '<option value="'+r.id+'"'+(b.roomId===r.id?' selected':'')+'>'+esc(r.name)+' · '+r.capacity+' seats</option>';}).join('')+'</select>')
    +fld('eFrom','From','<input id="eFrom" type="time" value="'+esc(b.start)+'">')
    +fld('eTo','To','<input id="eTo" type="time" value="'+esc(b.end)+'">')
    +'<div class="fld wide"><label>Invite employees — choose from dropdown</label>'+directoryPicker('e',b.directoryIds||[])+'</div>'
    +fld('eWho','Invitee names','<input id="eWho" value="'+esc((b.attendees||[]).join(', '))+'">','',true)
    +fld('eEmails','Emails','<input id="eEmails" inputmode="email" value="'+esc((b.emails||[]).join(', '))+'">','',true)
    +fld('ePhones','Phone numbers','<input id="ePhones" inputmode="tel" value="'+esc((b.phones||[]).join(', '))+'">','',true)
    +fld('eAg','Agenda','<textarea id="eAg">'+esc(b.agenda||'')+'</textarea>','',true)
    +'<div class="fld wide"><label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;color:var(--ink-2)">'
      +'<input id="eVirt" type="checkbox" style="width:16px;height:16px"'+(b.virtual?' checked':'')+'> Include online meeting</label>'
      +'<div class="hint">Enabling this creates a Google Meet link when needed. Disabling removes the link from this portal booking.</div></div>'
    +'</div></div><div class="mod-f"><div class="grow"></div><button class="btn" id="ec">Cancel</button>'
    +'<button class="btn btn-p" id="es">Save changes</button></div></div>';
  document.body.appendChild(m);
  var close=function(){m.remove();}; m.querySelector('#ex').onclick=close; m.querySelector('#ec').onclick=close;
  m.addEventListener('click',function(e){if(e.target===m) close();});
  m.querySelector('#es').onclick=async function(){
    var title=m.querySelector('#eT').value.trim(), date=m.querySelector('#eDate').value;
    var from=m.querySelector('#eFrom').value,to=m.querySelector('#eTo').value,room=m.querySelector('#eRoom').value;
    var virt=m.querySelector('#eVirt').checked;
    if(!title||!date||!from||!to||toMin(to)<=toMin(from)){toast('Enter a valid title, date and time',false);return;}
    if(!room&&!virt){toast('Choose a room or keep the online meeting enabled',false);return;}
    var clash=overlaps(room,date,from,to,b.id);
    if(clash){toast('That room is already booked for '+clash.start+'–'+clash.end,false);return;}
    var meetSpace=null,saveEdit=m.querySelector('#es');
    var inviteEmails=splitList(m.querySelector('#eEmails').value);
    var calendarInfo={title:title,date:date,from:from,to:to,agenda:m.querySelector('#eAg').value.trim(),
      emails:inviteEmails,virtual:virt,location:room?((STORE.rooms.find(function(r){return r.id===room;})||{}).name||''):''};
    saveEdit.disabled=true;saveEdit.textContent='Updating Calendar invitation…';
    try{
      if(b.calendarEventId){
        var updatedEvent=await updateGoogleCalendarEvent(b,calendarInfo);
        meetSpace={meetingUri:virt?calendarMeetLink(updatedEvent):'',name:updatedEvent.id||b.calendarEventId,
          meetingCode:'',calendarEventId:updatedEvent.id||b.calendarEventId,calendarHtmlLink:updatedEvent.htmlLink||b.calendarHtmlLink||'',
          calendarOrganizer:(updatedEvent.organizer&&updatedEvent.organizer.email)||b.calendarOrganizer||''};
      }else meetSpace=await createGoogleMeetSpace(calendarInfo);
    }catch(error){saveEdit.disabled=false;saveEdit.textContent='Save changes';toast(googleMeetErrorText(error),false);return;}
    b.title=title;b.date=date;b.start=from;b.end=to;b.roomId=room;
    b.attendees=splitList(m.querySelector('#eWho').value);b.emails=inviteEmails;
    b.phones=splitList(m.querySelector('#ePhones').value);b.directoryIds=selectedDirectoryIds('e');b.agenda=m.querySelector('#eAg').value.trim();
    if(meetSpace){
      b.meetingProvider=meetSpace.meetingUri?'google_meet':'';b.meetUri=meetSpace.meetingUri||'';
      b.meetSpaceName=meetSpace.name||'';b.meetCode=meetSpace.meetingCode||'';b.meetCreatedAt=b.meetCreatedAt||nowISO();
      b.calendarEventId=meetSpace.calendarEventId||b.calendarEventId||'';b.calendarHtmlLink=meetSpace.calendarHtmlLink||b.calendarHtmlLink||'';
      b.calendarOrganizer=meetSpace.calendarOrganizer||b.calendarOrganizer||'';
    }
    if(!virt&&b.virtual){
      var old=STORE.vrooms.find(function(v){return v.id===b.vroomId;});if(old)old.open=false;
      b.vroomId='';b.meetUri='';b.meetSpaceName='';b.meetCode='';b.meetingProvider='';
    }
    b.virtual=virt;
    var currentVr=STORE.vrooms.find(function(v){return v.id===b.vroomId;});if(currentVr)currentVr.name=title;
    syncMeetingRequest(b);auditRecord('update','meeting',b.id,title+' · Calendar guests notified');save();close();render();toast('Meeting and Calendar invitation updated',true);
  };
}
async function cancelMeeting(id){
  var b=STORE.bookings.find(function(x){return x.id===id;}); if(!b) return false;
  if(!(isAdmin()||(ME&&b.byId===ME.id))){toast('Only the organiser or Admin can cancel this meeting',false);return false;}
  if(!confirm('Cancel "'+b.title+'"? Everyone invited will lose the slot.')) return false;
  try{await deleteGoogleCalendarEvent(b);}
  catch(error){
    if(!confirm(googleMeetErrorText(error)+'\n\nCancel only inside this portal anyway?'))return false;
  }
  var r=b.requestId?STORE.requests.find(function(x){return x.id===b.requestId;}):null;
  if(r){r.status='cancelled';r.history=(r.history||[]).concat([{at:nowISO(),who:ME?ME.name:'',what:'Meeting cancelled'}]);}
  var vr=STORE.vrooms.find(function(v){return v.id===b.vroomId;});if(vr)vr.open=false;
  STORE.bookings=STORE.bookings.filter(function(x){return x.id!==b.id;});
  auditRecord('delete','meeting',b.id,b.title+' · Calendar cancellation sent');save();render();toast('Meeting cancelled · Calendar guests notified',true);return true;
}

function cartTick(inp){
  var n=Math.max(0,parseInt(inp.value,10)||0);
  inp.value=n;
  var box=document.getElementById('ci_'+inp.dataset.id);
  if(box) box.classList.toggle('has',n>0);
  var total=0;
  document.querySelectorAll('.cat-i input').forEach(function(i){ total+=Math.max(0,parseInt(i.value,10)||0); });
  var lbl=document.getElementById('cartN');
  if(lbl) lbl.textContent=total?(total+' item'+(total===1?'':'s')+' selected'):'Nothing selected';
}
function collectCart(){
  var out=[];
  document.querySelectorAll('.cat-i input').forEach(function(i){
    var q=Math.max(0,parseInt(i.value,10)||0);
    if(q>0) out.push({id:i.dataset.id,name:i.dataset.name,unit:i.dataset.unit,qty:q});
  });
  return out;
}
function saveSupply(kind){
  if(!needMe()) return;
  if(!requireUserPermission('canRequest','Admin has not enabled service requests for your account'))return;
  var items=collectCart();
  if(!items.length){ toast('Set a quantity on at least one item',false); return; }
  var approvals=requireAutomaticApprovers(kind);if(!approvals)return;
  var r=submitRequest(kind,{items:items,deliverTo:ME.dept},val('spPrio'),val('spWhen'),val('spNote'),approvals);
  toast('Request '+r.ref+' submitted \u00b7 '+items.length+' item'+(items.length===1?'':'s'),true);
  go('all');
}

function vAll(){

  else if(FILTER==='mine') all=all.filter(function(r){ return ME&&r.byId===ME.id; });
  else if(FILTER!=='all') all=all.filter(function(r){ return r.status===FILTER; });
  if(SEARCH){
    var q=SEARCH.toLowerCase();

      return (r.ref+' '+r.by+' '+r.dept+' '+requestTypeLabel(r)+' '+summary(r)).toLowerCase().indexOf(q)>=0;

         ['approved','Approved'],['declined','Declined'],['fulfilled','Fulfilled'],['all','Everything ('+counts.all+')']];

function openReq(id){
  var r=STORE.requests.find(function(x){ return x.id===id; }); if(!r) return;
  var d=r.details||{};
  var body='';
  if(r.type==='car'){
    body='<dt>Destination</dt><dd>'+esc(d.destination)+'</dd>'
      +'<dt>When</dt><dd>'+fmtDate(d.date)+' at '+esc(d.time)+(d.ret?(' · back by '+esc(d.ret)):'')+'</dd>'
      +'<dt>Passengers</dt><dd>'+esc(d.passengers)+'</dd>'
      +'<dt>Vehicle</dt><dd>'+esc(d.vehicle)+'</dd>'
      +'<dt>Purpose</dt><dd>'+esc(d.purpose)+'</dd>';
  } else if(r.type==='room'){
    body='<dt>Meeting</dt><dd>'+esc(d.title)+'</dd>'
      +'<dt>Room</dt><dd>'+esc(d.room||'—')+'</dd>'
      +'<dt>When</dt><dd>'+fmtDate(d.date)+' · '+esc(d.from)+'\u2013'+esc(d.to)+'</dd>'
      +'<dt>Invited</dt><dd>'+esc(d.attendees)+' people</dd>'
      +(d.agenda?('<dt>Agenda</dt><dd>'+esc(d.agenda)+'</dd>'):'');
  } else if(r.type==='it'){
    body='<dt>Category</dt><dd>'+esc(d.category)+'</dd>'
      +'<dt>Subject</dt><dd>'+esc(d.subject)+'</dd>'
      +'<dt>Detail</dt><dd>'+esc(d.description)+'</dd>'
      +(d.location?('<dt>Location</dt><dd>'+esc(d.location)+'</dd>'):'')
      +(d.asset?('<dt>Asset</dt><dd>'+esc(d.asset)+'</dd>'):'');
  } else if(r.type==='custom'){
    body='<dt>Service</dt><dd>'+esc(d.serviceName||'Service request')+'</dd>'
      +'<dt>Subject</dt><dd>'+esc(d.subject||'—')+'</dd>'
      +'<dt>Details</dt><dd>'+esc(d.description||'—')+'</dd>'
      +(d.location?('<dt>Location</dt><dd>'+esc(d.location)+'</dd>'):'');
  } else {
    body='<dt>Items</dt><dd>'+(d.items||[]).map(function(i){
      return esc(i.qty)+' \u00d7 '+esc(i.name)+' <span style="color:var(--muted)">('+esc(i.unit)+')</span>';
    }).join('<br>')+'</dd><dt>Deliver to</dt><dd>'+esc(d.deliverTo||'—')+'</dd>';
  }
  var hist=(r.history||[]).map(function(h){
    return '<div style="display:flex;gap:10px;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line-soft)">'
      +'<span style="color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:10.5px">'+fmtWhen(h.at)+'</span>'
      +'<span><b>'+esc(h.what)+'</b>'+(h.who?(' — '+esc(h.who)):'')+'</span></div>';
  }).join('');
  var activeLevel=activeApprovalLevel(r);
  var approvals=(r.approvals||[]).map(function(a){
    var st=a.status||'pending',meta=st==='approved'?{label:'Approved',cls:'c-ok'}:(st==='declined'?{label:'Declined',cls:'c-no'}:{label:'Pending',cls:'c-wait'});
    return '<div class="approval-line"><div class="vp-av">L'+esc(Math.max(1,+a.level||1))+'</div><div style="min-width:0"><b>'+esc(a.name)+'</b>'
      +'<div style="font-size:10.5px;color:var(--muted)">Level '+esc(Math.max(1,+a.level||1))+(a.status==='pending'&&activeLevel&&Math.max(1,+a.level||1)>activeLevel?' · waiting for earlier level':'')+(a.email?' · '+esc(a.email):'')+(a.decidedAt?' · '+fmtWhen(a.decidedAt):'')+'</div></div>'
      +'<div style="margin-left:auto">'+chip(st,{pending:meta,approved:meta,declined:meta})+'</div></div>';
  }).join('');
  var canDecide=canApproveRequest(r);
  var m=document.createElement('div'); m.className='mod';
  m.innerHTML='<div class="mod-in"><div class="mod-h"><div>'
    +'<div class="mod-t">'+esc(r.ref)+' \u00b7 '+esc(requestTypeLabel(r))+'</div>'
    +'<div class="mod-s">'+esc(r.by)+' \u00b7 '+esc(r.dept)+' \u00b7 '+fmtWhen(r.created)+'</div></div>'
    +'<button class="mod-x" id="rx">&times;</button></div><div class="mod-b">'
    +'<div style="display:flex;gap:8px;margin-bottom:15px">'+chip(r.status,STATUS)+chip(r.priority,PRIO)
    +(r.needed?('<span class="chip c-done"><i></i>Needed '+esc(r.needed)+'</span>'):'')+'</div>'
    +'<dl class="dl">'+body+(r.note?('<dt>Note</dt><dd>'+esc(r.note)+'</dd>'):'')+'</dl>'
    +(approvals?'<div style="margin-top:16px"><div style="font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px">Approval chain</div>'+approvals+'</div>':'')
    +'<div style="margin-top:16px"><div style="font-size:10.5px;font-weight:800;text-transform:uppercase;'
    +'letter-spacing:.05em;color:var(--muted);margin-bottom:6px">History</div>'+hist+'</div>'
    +'</div><div class="mod-f">'
    +(canDecide?('<button class="btn btn-p" id="ra">Approve</button><button class="btn btn-d" id="rd">Decline</button>'):'')
    +(isApprover()&&r.status==='approved'?'<button class="btn" id="rf">Mark fulfilled</button>':'')
    +(isAdmin()?'<button class="btn" id="re">'+ico('edit')+'Edit</button><button class="btn btn-d" id="rz">'+ico('trash')+'Delete</button>':'')
    +'<div class="grow"></div><button class="btn" id="rc">Close</button></div></div>';
  document.body.appendChild(m);
  var close=function(){ m.remove(); };
  m.querySelector('#rx').onclick=close; m.querySelector('#rc').onclick=close;
  m.addEventListener('click',function(e){ if(e.target===m) close(); });
  if(canDecide){
    m.querySelector('#ra').onclick=function(){ close(); decide(r.id,'approved'); };
    m.querySelector('#rd').onclick=function(){
      var why=prompt('Why is this being declined? The requester will see this.');
      if(why===null) return;
      close(); decide(r.id,'declined',why.trim());
    };
  }
  if(isApprover()&&r.status==='approved') m.querySelector('#rf').onclick=function(){ close(); decide(r.id,'fulfilled'); };
  if(isAdmin()){
    m.querySelector('#re').onclick=function(){close();adminEditRequest(r.id);};
    m.querySelector('#rz').onclick=function(){if(adminDeleteRequest(r.id))close();};
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIRTUAL MEETING ROOM
   ───────────────────────────────────────────────────────────────────────────
   Real WebRTC, not a mock. Audio and screen sharing run peer-to-peer between
   browsers; Firebase carries only the signalling (offers, answers, ICE
   candidates), which is a few kilobytes per participant.

   HONEST LIMITS, stated in the interface as well as here:
     • The page must be served over HTTPS (or localhost). Browsers refuse
       microphone and screen capture on plain http:// or file://.
     • This is a MESH: every participant connects to every other. Fine to
       about six people; beyond that the uplink cost grows with the square of
       the group and an SFU would be needed instead.
     • STUN alone gets through most home and office networks. Some corporate
       firewalls need a TURN relay — there is a field for TURN credentials in
       Sync settings, and without one those participants will fail to connect.
     • Sync must be connected. Two browsers cannot find each other otherwise.
   ═══════════════════════════════════════════════════════════════════════════ */

var CURVR=null;
var VR={ pc:{}, dc:{}, local:null, screen:null, muted:false, joined:false,
         peers:{}, pendingIce:{}, retried:{}, retryTimers:{}, heartbeat:null,
         ref:null, meRef:null, infoRef:null, id:null, analyser:null, talkTimer:null,
         iceServers:null, turnReady:false, serverOffset:0, files:[], fileRx:{},
         fileSending:false, listenersReady:false };

/* Presence is based on Firebase server time, not the clocks on staff devices.
   Four minutes tolerates laptop sleep and short mobile-network handovers while
   onDisconnect still removes a participant promptly after a clean disconnect. */
var VR_PEER_TTL=240000;

function vrNow(){return Date.now()+(Number(VR.serverOffset)||0);}
function vrServerTimestamp(){
  try{return firebase.database.ServerValue.TIMESTAMP;}catch(e){return vrNow();}
}

function vrPeerFresh(p){
  if(!p||!p.at)return false;
  var age=vrNow()-Number(p.at);
  return age<VR_PEER_TTL&&age>-60000;
}

function iceURLList(value){
  if(Array.isArray(value))return value.map(function(x){return String(x||'').trim();}).filter(Boolean);
  return String(value||'').split(/[\s,;]+/).map(function(x){return x.trim();}).filter(Boolean);
}
function configuredTurn(){
  var t=null;
  try{
    t=(STORE&&STORE.settings&&STORE.settings.turn)||JSON.parse(localStorage.getItem('kp_services_turn')||'null');
  }catch(e){}
  var urls=iceURLList(t&&t.urls);
  if(!urls.length||!t||!String(t.username||'').trim()||!String(t.credential||'').trim())return null;
  return {urls:urls,username:String(t.username).trim(),credential:String(t.credential)};
}
async function openRelayTurn(){
  /* Legacy mesh fallback is disabled. Build 14 keeps LiveKit Cloud as a
     all media credentials on the server-side token function. */
  return null;
}
function iceServers(){
  var list=[{urls:[
    'stun:stun.l.google.com:19302',
    'stun:stun1.l.google.com:19302',
    'stun:stun2.l.google.com:19302',
    'stun:stun.cloudflare.com:3478'
  ]}];
  var t=configuredTurn();
  if(t)list.push(t);
  return list;
}
async function prepareIceServers(){
  var list=iceServers(),custom=!!configuredTurn();
  if(!custom){var fallback=await openRelayTurn();if(fallback)list.push(fallback);}
  VR.turnReady=list.some(function(s){return iceURLList(s&&s.urls).some(function(u){return /^turns?:/i.test(u);});});
  return list;
}

        +'<button class="vr-btn" id="vrMute" onclick="vrToggleMute()" disabled>'+ico('mic')+'<span>Mute</span></button>'
        +'<button class="vr-btn" id="vrShare" onclick="vrToggleShare()" disabled>'+ico('screen')+'<span>Share screen</span></button>'
        +'<button class="vr-btn" id="vrFile" onclick="document.getElementById(\'vrFileInput\').click()" disabled>'+ico('file')+'<span>Share file</span></button>'
        +'<input id="vrFileInput" type="file" multiple accept=".xlsx,.xls,.csv,.pdf,.doc,.docx,.ppt,.pptx,.txt,.zip,.png,.jpg,.jpeg" style="display:none" onchange="vrShareFiles(this)">'
        +'<div style="flex:1"></div>'
        +'<span id="vrState" style="font-size:11.5px;color:#9AA7B5;font-weight:700">Not connected</span>'
      +'</div>'
      +'<div id="vrAudioBank" style="display:none" aria-hidden="true"></div>'
    +'</div>'
    +'<div class="vr-side">'
      +'<div class="card"><div class="card-h"><div class="card-t"><span class="ico">'+ico('mic')+'</span>In the room</div>'
        +'<span id="vrCount" style="font-size:11px;color:var(--muted);font-weight:700">0</span></div>'
        +'<div class="vr-people" id="vrPeople"><div class="t-empty" style="padding:20px">'

      +(!secure?('<div class="vr-note" style="background:var(--risk-bg);border-color:#E4B4BA;color:var(--risk)">'
        +'<b>Microphone and screen sharing are blocked.</b> Browsers only allow them over <b>https://</b> '
        +'(or on localhost). This page is on <b>'+esc(location.protocol)+'</b>, so joining will fail until '
        +'the portal is served over HTTPS.</div>'):'')
      +(!synced?('<div class="vr-note" style="background:var(--warn-bg);border-color:#DFC98F;color:var(--warn)">'
        +'<b>Portal data is reconnecting.</b> You can still try to join; refresh the page if the invitation details do not appear.</div>'):'')

        +'<b>LiveKit media server.</b> Audio and screen quality adapt automatically to each participant\'s connection, '
        +'so one slow device does not delay the entire room.</div>'

        +'only to the people already connected to this room. The portal does not save meeting files in Firebase.</div>'
