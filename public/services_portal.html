}

function vrCreate(){
  if(!needMe()) return;
  var n=val('vrName');
  if(!n){ toast('Give the room a name so people know what they are joining',false); return; }
  var v={id:uid('vr'),name:n,host:ME.name,created:nowISO(),open:true};
  STORE.vrooms.unshift(v); save();
  CURVR=v.id; render();
}
function vrJoin(id){ if(!needMe()) return; CURVR=id; render(); }

function vrMount(){
  var v=CURVR?STORE.vrooms.find(function(x){ return x.id===CURVR; }):null;
  if(!v) return;
  vrPaintPeople();
  vrPaintFiles();
}
function vrState(t,cls){
  var e=document.getElementById('vrState');
  if(e){ e.textContent=t; e.style.color=cls==='ok'?'#7BD9A8':cls==='err'?'#FFB4B4':'#9AA7B5'; }
}

/* ── Join / leave ────────────────────────────────────────────────────────── */
function vrPresencePayload(){
  return {name:ME.name,dept:ME.dept,muted:!!VR.muted,sharing:!!VR.screen,
          build:PORTAL_BUILD,at:vrServerTimestamp()};
}
function vrWritePresence(){
  if(!VR.meRef)return Promise.reject(new Error('Meeting presence is not ready'));
  try{VR.meRef.onDisconnect().remove();}catch(e){}
  return VR.meRef.set(vrPresencePayload()).then(function(){
    return VR.meRef.once('value');
  }).then(function(s){
    if(!s.exists())throw new Error('Firebase did not keep the participant record');
    return true;
  });
}
function vrPromiseTimeout(p,ms,message){
  return Promise.race([p,new Promise(function(_,reject){
    setTimeout(function(){reject(new Error(message||'Timed out'));},ms);
  })]);
}
function vrRemovePeer(id){
  delete VR.peers[id];delete VR.pendingIce[id];delete VR.retried[id];
  if(VR.retryTimers[id]){clearTimeout(VR.retryTimers[id]);delete VR.retryTimers[id];}
  if(VR.dc[id]){try{VR.dc[id].close();}catch(e){}delete VR.dc[id];}
  if(VR.pc[id]){try{VR.pc[id].close();}catch(e){}delete VR.pc[id];}
  var audio=document.getElementById('vrAudio_'+id);if(audio)audio.remove();
  delete VR.fileRx[id];
}
function vrAttachLiveListeners(base){
  if(VR.listenersReady)return;
  VR.listenersReady=true;
  base.child('peers').on('child_added',function(s){
    if(s.key===VR.id)return;
    if(!vrPeerFresh(s.val()))return;
    VR.peers[s.key]=s.val();vrPaintPeople();
    /* Deterministic offerer: the lexically smaller id calls, so two browsers
       never both create an offer for the same pair. */
    if(VR.id<s.key)vrCall(s.key);
  });
  base.child('peers').on('child_changed',function(s){
    if(s.key===VR.id)return;
    if(!vrPeerFresh(s.val())){vrRemovePeer(s.key);vrPaintPeople();return;}
    var first=!VR.peers[s.key];
    VR.peers[s.key]=s.val();vrPaintPeople();
    if(first&&VR.id<s.key)vrCall(s.key);
  });
  base.child('peers').on('child_removed',function(s){
    vrRemovePeer(s.key);vrPaintPeople();
  });
  base.child('signals/'+VR.id).on('child_added',function(s){
    var msg=s.val();s.ref.remove();if(msg)vrSignal(msg);
  });
}
function vrWatchFirebaseConnection(){
  try{
    VR.infoRef=firebase.database().ref('.info/connected');
    VR.infoRef.on('value',function(s){
      if(!VR.joined)return;
      if(s.val()!==true){vrState('Reconnecting to meeting…');return;}
      vrWritePresence().then(function(){
        if(VR.joined&&Object.keys(VR.peers).length===0)vrState('In room — waiting for others','ok');
      }).catch(function(e){
        vrState('Meeting sync blocked','err');
        toast('Firebase could not register you in the meeting: '+(e&&e.message||e),false);
      });
    });
  }catch(e){}
}
async function vrToggleJoin(){
  if(VR.joined){ vrLeave(); return; }
  if(!needMe()) return;
  if(!(SY&&SY.ref&&SY.writable)){ toast('Wait for the top-right Sync indicator to show Live, then join again',false); return; }
  if(window.isSecureContext===false){
    toast('Open this meeting from the secure https:// portal link, then try again.',false); return;
  }
  vrState('Preparing secure connection…');
  VR.iceServers=await prepareIceServers();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('This browser cannot capture a microphone. Try Chrome, Edge or Safari over https://',false); return;
  }
  try{
    vrState('Requesting microphone…');
    VR.local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
  }catch(e){
    var why=(e&&e.name==='NotAllowedError')
      ? 'Microphone permission was refused. Allow it in the browser address bar and try again.'
      : (e&&e.name==='NotFoundError') ? 'No microphone was found on this device.'
      : ('Could not open the microphone: '+(e&&e.message||e));
    vrState('Microphone unavailable','err');
    toast(why,false);
    return;
  }
  VR.id=uid('p');
  VR.joined=true;
  vrMeter();

  var base=SY.ref.child('vroomLive/'+CURVR);
  VR.ref=base;
  VR.meRef=base.child('peers/'+VR.id);
  try{
    var os=await firebase.database().ref('.info/serverTimeOffset').once('value');
    VR.serverOffset=Number(os.val())||0;
  }catch(e){VR.serverOffset=0;}
  vrAttachLiveListeners(base);
  try{
    await vrPromiseTimeout(vrWritePresence(),10000,'Firebase did not confirm meeting presence');
  }catch(e){
    vrLeave();vrState('Meeting sync blocked','err');
    toast('Could not enter the shared meeting: '+(e&&e.message||e)+'. Check Firebase write rules for asimati-services/vroomLive.',false);
    return;
  }
  vrWatchFirebaseConnection();
  clearInterval(VR.heartbeat);
  VR.heartbeat=setInterval(function(){
    if(VR.joined&&VR.meRef)VR.meRef.update({at:vrServerTimestamp()}).catch(function(){});
  },15000);

  document.getElementById('vrJoinBtn').innerHTML=ico('micOff')+'<span>Leave</span>';
  document.getElementById('vrJoinBtn').classList.add('off');
  document.getElementById('vrMute').disabled=false;
  document.getElementById('vrShare').disabled=false;
  document.getElementById('vrFile').disabled=false;
  vrState(Object.keys(VR.peers).length?'Connecting to participants…':'In room — waiting for others','ok');
  vrPaintPeople();
  toast('You are in the room — others will hear you now',true);
}

function vrPeer(id){
  if(VR.pc[id]) return VR.pc[id];
  var pc=new RTCPeerConnection({iceServers:VR.iceServers||iceServers(),iceCandidatePoolSize:10});
  VR.pc[id]=pc;
  if(VR.local) VR.local.getTracks().forEach(function(t){ pc.addTrack(t,VR.local); });
  if(VR.screen) VR.screen.getTracks().forEach(function(t){ pc.addTrack(t,VR.screen); });
  pc.ondatachannel=function(e){if(e.channel)vrBindDataChannel(id,e.channel);};
  /* The designated offerer opens one reliable, ordered data channel. Excel,
     PDF and other files then travel directly between participants and never
     inflate the Realtime Database. */
  if(VR.id&&VR.id<id){
    try{vrBindDataChannel(id,pc.createDataChannel('kp-files',{ordered:true}));}catch(e){}
  }
  pc.onicecandidate=function(e){
    if(e.candidate) vrSend(id,{t:'ice',from:VR.id,c:e.candidate.toJSON()});
  };
  pc.ontrack=function(e){
    var st=e.streams[0];
    if(e.track.kind==='audio'){
      var a=document.getElementById('vrAudio_'+id),bank=document.getElementById('vrAudioBank');
      if(!a&&bank){a=document.createElement('audio');a.id='vrAudio_'+id;a.autoplay=true;a.playsInline=true;bank.appendChild(a);}
      if(a && a.srcObject!==st) a.srcObject=st;
    } else {
      var vid=document.getElementById('vrScreen');
      if(vid){ vid.srcObject=st; vid.style.display='block';
        var em=document.getElementById('vrEmpty'); if(em) em.style.display='none'; }
    }
  };
  pc.onconnectionstatechange=function(){
    if(VR.pc[id]!==pc) return;
    if(pc.connectionState==='connected'){
      delete VR.retried[id];
      vrState('Connected','ok');
    } else if(pc.connectionState==='disconnected'){
      vrState('Reconnecting…');
      if(VR.retryTimers[id]) clearTimeout(VR.retryTimers[id]);
      VR.retryTimers[id]=setTimeout(function(){
        if(VR.pc[id]===pc&&pc.connectionState==='disconnected'&&VR.id<id) vrCall(id,true);
      },3500);
    } else if(pc.connectionState==='failed'){
      if(!VR.retried[id]&&VR.id<id&&vrPeerFresh(VR.peers[id])){
        VR.retried[id]=true;
        vrState('Retrying connection…');
        VR.retryTimers[id]=setTimeout(function(){ vrCall(id,true); },900);
      }else{
        var hasTurn=!!(VR.turnReady||configuredTurn());
        vrState(hasTurn?'Connection failed — check TURN settings':'Network blocked — TURN required','err');
        console.warn('[vr] connection failed for',id,hasTurn?'— verify TURN credentials':'— add a TURN relay in Admin > Sync settings');
      }
    }
  };
  return pc;
}

/* ── Direct file sharing over the meeting data channel ─────────────────── */
var VR_FILE_MAX=20*1024*1024;
var VR_FILE_CHUNK=16*1024;
function vrHumanBytes(n){
  n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(n<10240?1:0)+' KB';
  return (n/1048576).toFixed(n<10485760?1:0)+' MB';
}
function vrBindDataChannel(id,dc){
  if(!dc)return;
  var old=VR.dc[id];if(old&&old!==dc){try{old.close();}catch(e){}}
  VR.dc[id]=dc;dc.binaryType='arraybuffer';dc.bufferedAmountLowThreshold=256*1024;
  dc.onopen=function(){vrPaintFiles();};
  dc.onclose=function(){if(VR.dc[id]===dc)delete VR.dc[id];};
  dc.onerror=function(e){console.warn('[vr] file channel error',id,e);};
  dc.onmessage=function(e){vrHandleDataMessage(id,e.data);};
}
function vrHandleDataMessage(peerId,data){
  if(data instanceof Blob){data.arrayBuffer().then(function(b){vrHandleDataMessage(peerId,b);});return;}
  if(typeof data==='string'){
    var m=null;try{m=JSON.parse(data);}catch(e){}
    if(!m||m.kp!=='file')return;
    if(m.action==='meta'){
      if(Number(m.size)>VR_FILE_MAX){VR.fileRx[peerId]={reject:true,id:m.id};return;}
      VR.fileRx[peerId]={id:String(m.id||uid('f')),name:String(m.name||'Shared file'),
        size:Number(m.size)||0,mime:String(m.mime||'application/octet-stream'),
        from:String(m.from||((VR.peers[peerId]||{}).name)||'Participant'),chunks:[],received:0};
      vrState('Receiving '+VR.fileRx[peerId].name+'…');
    }else if(m.action==='done'){
      var rx=VR.fileRx[peerId];delete VR.fileRx[peerId];
      if(!rx||rx.reject||rx.id!==m.id)return;
      if(rx.size&&rx.received!==rx.size){toast('The shared file was incomplete. Ask the sender to try again.',false);return;}
      var blob=new Blob(rx.chunks,{type:rx.mime}),url=URL.createObjectURL(blob);
      vrAddSharedFile({id:rx.id,name:rx.name,size:blob.size,mime:rx.mime,from:rx.from,
        url:url,direction:'received',at:Date.now()});
      vrState('Connected','ok');
      toast(rx.from+' shared '+rx.name,true);
    }
    return;
  }
  var rx=VR.fileRx[peerId];if(!rx||rx.reject)return;
  if(data instanceof ArrayBuffer){
    if(rx.received+data.byteLength>VR_FILE_MAX){rx.reject=true;rx.chunks=[];return;}
    rx.chunks.push(data);rx.received+=data.byteLength;
  }
}
function vrAddSharedFile(f){
  if(VR.files.some(function(x){return x.id===f.id&&x.direction===f.direction;}))return;
  VR.files.unshift(f);
  while(VR.files.length>20){var old=VR.files.pop();if(old&&old.url)try{URL.revokeObjectURL(old.url);}catch(e){}}
  vrPaintFiles();
}
function vrPaintFiles(){
  var host=document.getElementById('vrFiles'),count=document.getElementById('vrFileCount');
  if(count)count.textContent=VR.files.length;if(!host)return;
  if(!VR.files.length){host.innerHTML='<div class="t-empty" style="padding:18px"><b>No files yet</b>Use Share file to send Excel, PDF, Word, PowerPoint or another supported file.</div>';return;}
  host.innerHTML=VR.files.map(function(f){
    var meta=(f.direction==='received'?'From ':'Shared by ')+esc(f.from||'Participant')+' · '+vrHumanBytes(f.size);
    return '<div class="vf"><div class="vf-icon">'+ico('file')+'</div><div class="vf-main">'
      +'<div class="vf-name" title="'+esc(f.name)+'">'+esc(f.name)+'</div><div class="vf-meta">'+meta+'</div></div>'
      +'<button class="vf-get" title="Download" onclick="vrDownloadFile(\''+esc(f.id)+'\')">'+ico('download')+'</button></div>';
  }).join('');
}
function vrDownloadFile(id){
  var f=VR.files.find(function(x){return x.id===id;});if(!f||!f.url)return;
  var a=document.createElement('a');a.href=f.url;a.download=f.name||'shared-file';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
}
function vrWaitForBuffer(dc){
  return new Promise(function(resolve,reject){
    var started=Date.now();
    function check(){
      if(!dc||dc.readyState!=='open'){reject(new Error('Participant connection closed'));return;}
      if(dc.bufferedAmount<512*1024){resolve();return;}
      if(Date.now()-started>15000){reject(new Error('File channel is too slow'));return;}
      setTimeout(check,40);
    }
    check();
  });
}
async function vrSendFileToChannel(dc,file,id,buffer){
  dc.send(JSON.stringify({kp:'file',action:'meta',id:id,name:file.name,size:file.size,
    mime:file.type||'application/octet-stream',from:ME.name}));
  for(var at=0;at<buffer.byteLength;at+=VR_FILE_CHUNK){
    await vrWaitForBuffer(dc);dc.send(buffer.slice(at,Math.min(buffer.byteLength,at+VR_FILE_CHUNK)));
  }
  await vrWaitForBuffer(dc);dc.send(JSON.stringify({kp:'file',action:'done',id:id}));
}
async function vrShareFiles(input){
  var files=Array.prototype.slice.call(input&&input.files||[]);if(input)input.value='';
  if(!files.length)return;
  if(!VR.joined){toast('Join the meeting before sharing a file',false);return;}
  if(VR.fileSending){toast('Another file is still being sent',false);return;}
  VR.fileSending=true;
  try{
    for(var fi=0;fi<files.length;fi++){
      var file=files[fi];
      if(file.size>VR_FILE_MAX){toast(file.name+' is larger than the 20 MB meeting limit',false);continue;}
      var channels=Object.keys(VR.dc).map(function(id){return VR.dc[id];}).filter(function(dc){return dc&&dc.readyState==='open';});
      if(!channels.length){toast('No participant is fully connected yet. Wait until the meeting status says Connected.',false);break;}
      var buffer=await file.arrayBuffer(),transferId=uid('file'),sent=0;
      for(var ci=0;ci<channels.length;ci++){
        try{
          vrState('Sending '+file.name+' · '+(ci+1)+'/'+channels.length+'…');
          await vrSendFileToChannel(channels[ci],file,transferId,buffer);sent++;
        }catch(e){console.warn('[vr] file send failed',e);}
      }
      if(sent){
        vrAddSharedFile({id:transferId,name:file.name,size:file.size,mime:file.type,from:ME.name,
          url:URL.createObjectURL(file),direction:'sent',at:Date.now()});
        toast(file.name+' shared with '+sent+' participant'+(sent===1?'':'s'),true);
      }else toast('The file could not reach any participant',false);
    }
  }catch(e){toast('File sharing failed: '+(e&&e.message||e),false);}
  VR.fileSending=false;vrState('Connected','ok');
}
function vrSend(to,msg){ try{ VR.ref.child('signals/'+to).push(msg); }catch(e){} }

async function vrCall(id,restart){
  try{
    var pc=vrPeer(id);
    var offer=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:true,iceRestart:!!restart});
    await pc.setLocalDescription(offer);
    vrSend(id,{t:'offer',from:VR.id,sdp:pc.localDescription.toJSON?pc.localDescription.toJSON():{type:offer.type,sdp:offer.sdp}});
  }catch(e){ console.warn('[vr] call failed',e); }
}
function vrQueueIce(id,c){
  (VR.pendingIce[id]||(VR.pendingIce[id]=[])).push(c);
}
async function vrFlushIce(id,pc){
  var q=VR.pendingIce[id]||[];
  VR.pendingIce[id]=[];
  for(var i=0;i<q.length;i++){
    try{ await pc.addIceCandidate(new RTCIceCandidate(q[i])); }
    catch(e){ console.warn('[vr] queued ICE failed',e); }
  }
}
async function vrSignal(m){
  try{
    var pc=vrPeer(m.from);
    if(m.t==='offer'){
      await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
      await vrFlushIce(m.from,pc);
      var ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      vrSend(m.from,{t:'answer',from:VR.id,sdp:{type:ans.type,sdp:ans.sdp}});
    } else if(m.t==='answer'){
      await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
      await vrFlushIce(m.from,pc);
    } else if(m.t==='ice'){
      if(pc.remoteDescription&&pc.remoteDescription.type)
        await pc.addIceCandidate(new RTCIceCandidate(m.c));
      else vrQueueIce(m.from,m.c);
    }
  }catch(e){ console.warn('[vr] signal failed',m.t,e); }
}

function vrToggleMute(){
  if(!VR.local) return;
  VR.muted=!VR.muted;
  VR.local.getAudioTracks().forEach(function(t){ t.enabled=!VR.muted; });
  var b=document.getElementById('vrMute');
  b.innerHTML=(VR.muted?ico('micOff'):ico('mic'))+'<span>'+(VR.muted?'Unmute':'Mute')+'</span>';
  b.classList.toggle('off',VR.muted);
  if(VR.meRef) VR.meRef.update({muted:VR.muted});
  vrPaintPeople();
}

async function vrToggleShare(){
  if(VR.screen){ vrStopShare(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){
    toast('This browser cannot share a screen. Chrome, Edge or Safari over https:// can.',false); return;
  }
  try{
    VR.screen=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:12},audio:false});
  }catch(e){
    if(e&&e.name==='NotAllowedError'){ toast('Screen sharing was cancelled',false); }
    else toast('Could not start sharing: '+(e&&e.message||e),false);
    return;
  }
  var track=VR.screen.getVideoTracks()[0];
  track.onended=vrStopShare;
  Object.keys(VR.pc).forEach(function(id){
    try{ VR.pc[id].addTrack(track,VR.screen); }catch(e){}
    vrRenegotiate(id);
  });

function vrStopShare(){
  if(VR.screen){ VR.screen.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); VR.screen=null; }
  var v=document.getElementById('vrScreen');

async function vrRenegotiate(id){

    var pc=VR.pc[id]; if(!pc) return;
    if(VR.id>=id) return;                    /* only the designated offerer renegotiates */
    var o=await pc.createOffer();
    await pc.setLocalDescription(o);
    vrSend(id,{t:'offer',from:VR.id,sdp:{type:o.type,sdp:o.sdp}});
  }catch(e){ console.warn('[vr] renegotiate failed',e); }
}

/* Simple speaking indicator from the local mic level. */
function vrMeter(){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx||!VR.local) return;
    var ctx=new Ctx(), src=ctx.createMediaStreamSource(VR.local), an=ctx.createAnalyser();
    an.fftSize=512; src.connect(an);
    VR.analyser=an;
    var data=new Uint8Array(an.frequencyBinCount);
    clearInterval(VR.talkTimer);
    VR.talkTimer=setInterval(function(){
      if(!VR.joined) return;
      an.getByteFrequencyData(data);
      var sum=0; for(var i=0;i<data.length;i++) sum+=data[i];
      var loud=(sum/data.length)>14 && !VR.muted;
      var el=document.getElementById('vp_me');
      if(el) el.classList.toggle('talk',loud);
    },220);
  }catch(e){}
}

function vrLeave(goBack){

  if(VR.ref){ try{ VR.ref.child('peers').off(); VR.ref.child('signals/'+VR.id).off(); }catch(e){} }
  if(VR.infoRef){try{VR.infoRef.off();}catch(e){}}

  if(VR.local) VR.local.getTracks().forEach(function(t){ try{t.stop();}catch(e){} });
  if(VR.screen) VR.screen.getTracks().forEach(function(t){ try{t.stop();}catch(e){} });
  (VR.files||[]).forEach(function(f){if(f.url)try{URL.revokeObjectURL(f.url);}catch(e){}});

  VR={pc:{},dc:{},local:null,screen:null,muted:false,joined:false,peers:{},pendingIce:{},retried:{},retryTimers:{},heartbeat:null,
    ref:null,meRef:null,infoRef:null,id:null,analyser:null,talkTimer:null,iceServers:null,turnReady:false,

/* ═══════════════════════════════════════════════════════════════════════════
   LIVEKIT SFU MEETING ENGINE — build 13
   These declarations intentionally replace the legacy mesh handlers above.
   Firebase continues to store bookings, rooms and approval routes; LiveKit
   carries only live meeting media and realtime file streams.
   ═══════════════════════════════════════════════════════════════════════════ */
var VR_LK_LOAD=null;
var VR_FILE_TOPIC='kp-meeting-files-v1';

function vrNewState(){
  return {room:null,joined:false,joining:false,leaving:false,muted:false,screen:null,
    id:null,files:[],fileSending:false,presentingTrack:null,activeSpeakers:{}};
}

function vrLoadLiveKit(){
  if(window.LivekitClient&&window.LivekitClient.Room)return Promise.resolve(window.LivekitClient);
  if(!VR_LK_LOAD){
    VR_LK_LOAD=loadScript(LIVEKIT_SDK_URL).then(function(){
      if(!window.LivekitClient||!window.LivekitClient.Room)throw new Error('LiveKit SDK did not start');
      return window.LivekitClient;
    }).catch(function(e){VR_LK_LOAD=null;throw e;});
  }
  return VR_LK_LOAD;
}

function vrOpaqueId(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return uid('p');
}

async function vrFetchLiveKitToken(){
  var response;
  try{
    response=await fetch(LIVEKIT_TOKEN_ENDPOINT,{
      method:'POST',
      mode:'cors',
      cache:'no-store',
      credentials:'omit',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({roomId:CURVR,name:ME&&ME.name||'Participant',dept:ME&&ME.dept||''})
    });
  }catch(e){
    throw new Error('The secure meeting server is not reachable yet');
  }
  var data={};
  try{data=await response.json();}catch(e){}
  if(!response.ok||!data.token||!data.url){
    throw new Error(data.error||('Meeting server returned '+response.status));
  }
  return data;
}

function vrParticipantDept(p){
  try{return (JSON.parse(p&&p.metadata||'{}').dept||'');}catch(e){return '';}
}

function vrParticipantName(p){
  return String(p&&p.name||p&&p.identity||'Participant');
}

function vrOn(room,event,fn){if(event)room.on(event,fn);}

function vrTrackIsAudio(track){
  var LK=window.LivekitClient||{};
  return !!track&&(track.kind==='audio'||(LK.Track&&track.kind===LK.Track.Kind.Audio));
}

function vrPublicationIsScreen(pub){
  var LK=window.LivekitClient||{},source=pub&&pub.source;
  return !!pub&&(source==='screen_share'||(LK.Track&&source===LK.Track.Source.ScreenShare));
}

function vrDetachTrack(track){
  if(!track||!track.detach)return;
  try{(track.detach()||[]).forEach(function(el){if(el&&el.parentNode)el.remove();});}catch(e){}
}

function vrAttachAudio(track,participant){
  var bank=document.getElementById('vrAudioBank');if(!bank||!track||!track.attach)return;
  try{
    var el=track.attach();
    el.autoplay=true;el.playsInline=true;
    el.dataset.participant=participant&&participant.identity||'';
    bank.appendChild(el);
    var play=el.play&&el.play();if(play&&play.catch)play.catch(function(){});
  }catch(e){console.warn('[livekit] audio attach failed',e);}
}

function vrScreenTrackFor(p){
  var LK=window.LivekitClient||{};
  if(!p||!p.getTrackPublication||!LK.Track)return null;
  var pub=p.getTrackPublication(LK.Track.Source.ScreenShare);
  return pub&&!pub.isMuted&&(pub.track||pub.videoTrack)||null;
}

function vrRefreshStage(){
  var room=VR.room,v=document.getElementById('vrScreen'),empty=document.getElementById('vrEmpty');
  if(!v)return;
  var chosen=null;
  if(room){
    chosen=vrScreenTrackFor(room.localParticipant);
    if(!chosen)room.remoteParticipants.forEach(function(p){if(!chosen)chosen=vrScreenTrackFor(p);});
  }
  if(VR.presentingTrack&&VR.presentingTrack!==chosen){
    try{VR.presentingTrack.detach(v);}catch(e){}
  }
  VR.presentingTrack=chosen||null;
  VR.screen=room&&room.localParticipant&&room.localParticipant.isScreenShareEnabled
    ?vrScreenTrackFor(room.localParticipant):null;
  if(chosen){
    try{chosen.attach(v);}catch(e){}
    v.muted=true;v.style.display='block';
    if(empty)empty.style.display='none';
    var play=v.play&&v.play();if(play&&play.catch)play.catch(function(){});
  }else{
    try{v.pause();}catch(e){}
    v.srcObject=null;v.style.display='none';
    if(empty)empty.style.display='grid';
  }
  vrUpdateControlButtons();

function vrUpdateControlButtons(){
  var joined=!!(VR&&VR.joined),joining=!!(VR&&VR.joining);
  var join=document.getElementById('vrJoinBtn'),mute=document.getElementById('vrMute');
  var share=document.getElementById('vrShare'),file=document.getElementById('vrFile');

function vrReattachSubscribedMedia(){
  if(!VR.room)return;
  VR.room.remoteParticipants.forEach(function(p){
    if(!p.trackPublications)return;
    p.trackPublications.forEach(function(pub){
      var track=pub&&pub.track;
      if(track&&vrTrackIsAudio(track))vrAttachAudio(track,p);
    });
  });
  vrRefreshStage();
}

function vrRegisterFileHandler(room){
  if(!room.registerByteStreamHandler)return;
  room.registerByteStreamHandler(VR_FILE_TOPIC,function(reader,participantInfo){
    (async function(){
      var info=reader.info||{},size=Number(info.size)||0;
      if(size>VR_FILE_MAX){
        toast('A participant tried to send a file larger than the 20 MB limit',false);
        await reader.readAll();return;
      }
      var identity=participantInfo&&participantInfo.identity||String(participantInfo||'');
      var remote=room.remoteParticipants.get(identity);
      var from=remote?vrParticipantName(remote):String(participantInfo&&participantInfo.name||'Participant');
      reader.onProgress=function(progress){
        if(typeof progress==='number')vrState('Receiving '+(info.name||'file')+' · '+Math.round(progress*100)+'%');
      };
      var chunks=await reader.readAll();
      var blob=new Blob(chunks,{type:info.mimeType||'application/octet-stream'});
      var id=String(info.id||uid('file'));
      vrAddSharedFile({id:id,name:String(info.name||'Shared file'),size:blob.size,
        mime:String(info.mimeType||blob.type),from:from,url:URL.createObjectURL(blob),
        direction:'received',at:Date.now()});
      vrState('Connected','ok');
      toast(from+' shared '+String(info.name||'a file'),true);
    })().catch(function(e){
      vrState('Connected','ok');
      toast('Could not receive the shared file: '+(e&&e.message||e),false);
    });
  });
}

function vrBindLiveKitRoom(room){
  var LK=window.LivekitClient,E=LK.RoomEvent;
  vrOn(room,E.TrackSubscribed,function(track,pub,participant){
    if(vrTrackIsAudio(track))vrAttachAudio(track,participant);
    if(vrPublicationIsScreen(pub))vrRefreshStage();
    vrPaintPeople();
  });
  vrOn(room,E.TrackUnsubscribed,function(track,pub){
    vrDetachTrack(track);
    if(vrPublicationIsScreen(pub))vrRefreshStage();
    vrPaintPeople();
  });
  [E.ParticipantConnected,E.ParticipantDisconnected,E.ParticipantMetadataChanged,
   E.ParticipantNameChanged,E.TrackPublished,E.TrackUnpublished,E.TrackMuted,E.TrackUnmuted]
    .forEach(function(event){vrOn(room,event,function(){vrPaintPeople();vrRefreshStage();});});
  vrOn(room,E.ActiveSpeakersChanged,function(speakers){
    VR.activeSpeakers={};(speakers||[]).forEach(function(p){VR.activeSpeakers[p.identity]=true;});
    vrPaintPeople();
  });
  vrOn(room,E.LocalTrackPublished,function(){vrPaintPeople();vrRefreshStage();});
  vrOn(room,E.LocalTrackUnpublished,function(){vrPaintPeople();vrRefreshStage();});
  vrOn(room,E.Reconnecting,function(){vrState('Reconnecting…');});
  vrOn(room,E.Reconnected,function(){vrState('Connected','ok');vrPaintPeople();vrRefreshStage();});
  vrOn(room,E.MediaDevicesError,function(e){toast('Media device error: '+(e&&e.message||e),false);});
  vrOn(room,E.Disconnected,function(){
    if(VR.room!==room||VR.leaving)return;
    VR.joined=false;VR.muted=false;VR.screen=null;
    vrState('Disconnected — press Join to reconnect','err');
    vrUpdateControlButtons();vrPaintPeople();vrRefreshStage();
  });
  vrRegisterFileHandler(room);
}

/* Replaces the legacy Firebase-presence mount. LiveKit itself is now the
   source of truth for who is actually inside the media room. */

async function vrToggleJoin(){
  if(VR.joined){vrLeave();return;}
  if(VR.joining)return;
  if(!needMe())return;
  if(window.isSecureContext===false){
    toast('Open this meeting from the secure https:// portal link, then try again.',false);return;
  }
  VR=vrNewState();VR.joining=true;VR.id=vrOpaqueId();
  vrUpdateControlButtons();vrState('Loading secure meeting…');
  var room=null;
  try{
    var LK=await vrLoadLiveKit();
    var access=await vrFetchLiveKitToken();
    room=new LK.Room({
      adaptiveStream:true,
      dynacast:true,
      stopLocalTrackOnUnpublish:true,
      disconnectOnPageLeave:true
    });
    VR.room=room;
    vrBindLiveKitRoom(room);
    vrState('Connecting to media server…');
    await room.connect(access.url,access.token,{autoSubscribe:true});
    VR.joined=true;VR.joining=false;
    try{if(room.startAudio)await room.startAudio();}catch(e){}
    vrState('Requesting microphone…');
    await room.localParticipant.setMicrophoneEnabled(true);
    VR.muted=false;
    vrUpdateControlButtons();vrPaintPeople();vrRefreshStage();
    vrState('Connected','ok');
    toast('You are in the same LiveKit room — others will hear you now',true);
  }catch(e){
    if(room){try{VR.leaving=true;room.disconnect();}catch(x){}}
    var message=String(e&&e.message||e||'Could not join');
    VR=vrNewState();
    vrUpdateControlButtons();vrPaintPeople();vrRefreshStage();
    vrState('Meeting setup incomplete','err');
    toast('Could not join: '+message,false);
  }
}

async function vrShareFiles(input){
  var files=Array.prototype.slice.call(input&&input.files||[]);if(input)input.value='';
  if(!files.length)return;
  if(!VR.joined||!VR.room){toast('Join the meeting before sharing a file',false);return;}
  if(VR.fileSending){toast('Another file is still being sent',false);return;}
  if(!VR.room.localParticipant.sendFile){toast('Update the browser and try file sharing again',false);return;}
  if(!VR.room.remoteParticipants.size){toast('Wait until at least one other participant appears in the room',false);return;}
  VR.fileSending=true;vrUpdateControlButtons();
  try{
    for(var i=0;i<files.length;i++){
      let file=files[i];
      if(file.size>VR_FILE_MAX){toast(file.name+' is larger than the 20 MB meeting limit',false);continue;}
      vrState('Sending '+file.name+' · 0%');
      var info=await VR.room.localParticipant.sendFile(file,{
        topic:VR_FILE_TOPIC,
        mimeType:file.type||'application/octet-stream',
        onProgress:function(progress){vrState('Sending '+file.name+' · '+Math.round(progress*100)+'%');}
      });
      vrAddSharedFile({id:String(info&&info.id||uid('file')),name:file.name,size:file.size,
        mime:file.type,from:ME.name,url:URL.createObjectURL(file),direction:'sent',at:Date.now()});
      toast(file.name+' shared with the room',true);
    }
  }catch(e){toast('File sharing failed: '+(e&&e.message||e),false);}
  VR.fileSending=false;vrUpdateControlButtons();vrState('Connected','ok');
}

      +'<div class="vp-ico">'+(p.sharing?ico('screen'):'')

/* ═══════════════════════════════════════════════════════════════════════════
   SYNC — its own room, never the projects room
   ═══════════════════════════════════════════════════════════════════════════ */
var SY={ cfg:null, room:null, ref:null, announcementRef:null, on:false, base:null, writable:false };
var ANNOUNCEMENT_OUTBOX_KEY='kp_services_announcements_outbox_v1';
var ANNOUNCEMENT_MIGRATION_KEY='kp_services_announcements_v23_migrated';

function announcementListCopy(list){
  return JSON.parse(JSON.stringify(Array.isArray(list)?list:[]));
}
function queueAnnouncementsForSync(){
  try{localStorage.setItem(ANNOUNCEMENT_OUTBOX_KEY,JSON.stringify(STORE.announcements||[]));}catch(e){}
}
function readAnnouncementOutbox(){
  try{var v=JSON.parse(localStorage.getItem(ANNOUNCEMENT_OUTBOX_KEY)||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}
}
function clearAnnouncementOutbox(){
  try{localStorage.removeItem(ANNOUNCEMENT_OUTBOX_KEY);}catch(e){}
}
function mergeAnnouncementLists(remote,local){
  var out=[],byId={};
  announcementListCopy(remote).forEach(function(a){if(!a||!a.id)return;byId[a.id]=a;out.push(a);});
  announcementListCopy(local).forEach(function(a){
    if(!a||!a.id)return;
    var old=byId[a.id];
    if(!old){byId[a.id]=a;out.push(a);return;}
    var oldAt=String(old.updated||old.created||''),newAt=String(a.updated||a.created||'');
    if(newAt>=oldAt){var i=out.findIndex(function(x){return x.id===a.id;});if(i>=0)out[i]=a;byId[a.id]=a;}
  });
  return out.sort(function(a,b){return String(b.publishAt||b.created||'').localeCompare(String(a.publishAt||a.created||''));});
}
function syncAnnouncementsNow(){
  queueAnnouncementsForSync();
  var list=announcementListCopy(STORE.announcements||[]),writes=[];
  /* Announcements are mirrored to the proven main-portal room as well as the
     Services room. This keeps company notices available even when database
     rules allow the main portal but block a newly introduced Services room. */
  if(SY.announcementRef)writes.push(SY.announcementRef.set(list));
  if(SY.ref&&SY.writable)writes.push(SY.ref.child('announcements').set(list));
  if(!writes.length){
    toast('Saved on this device. It will publish automatically when Live connects.',false);
    return Promise.resolve(false);
  }
  return Promise.allSettled(writes).then(function(results){
    var ok=results.some(function(x){return x.status==='fulfilled';});
    if(ok){
      clearAnnouncementOutbox();
      if(SY.base)SY.base.announcements=announcementListCopy(list);
      toast('Announcement published to the team',true);
      return true;
    }
    var failed=results[0]&&results[0].reason;
    toast('Saved locally, but team publishing failed: '+(failed&&failed.message||failed||'database rejected the write'),false);
    return false;
  });
}

function startSharedAnnouncementBridge(){

/* One authoritative read, then targeted listeners — never a permanent root
   subscription, which is what made the projects portal expensive. */
function bootstrapSync(){
  var localBefore=announcementListCopy(STORE.announcements||[]);
  var queuedBefore=readAnnouncementOutbox();
  var legacyRescueAllowed=true;
  try{legacyRescueAllowed=localStorage.getItem(ANNOUNCEMENT_MIGRATION_KEY)!=='1';}catch(e){}
  var settled=false;
  var timer=setTimeout(function(){
    if(settled) return; settled=true;
    SY.writable=false; paintSync();
    startSharedAnnouncementBridge();
    toast('The database did not respond. Working offline; your changes stay on this device.',false);
  },12000);
  SY.ref.once('value').then(function(snap){
    if(settled) return; settled=true; clearTimeout(timer);
    var d=snap&&snap.val();
    var remoteContacts=JSON.stringify((d&&d.contacts)||[]);
    if(d&&d.v){
      STORE=d; normalise();
      try{ localStorage.setItem(SK,JSON.stringify(STORE)); }catch(e){}
    }
    /* Recover an admin announcement that an older build saved only locally,
       then publish it to the shared production room. */
    var rescue=queuedBefore.length?queuedBefore:((legacyRescueAllowed&&ME&&ME.role==='admin')?localBefore:[]);
    if(rescue.length)STORE.announcements=mergeAnnouncementLists(STORE.announcements||[],rescue);
    applyPortalLink();
    SY.base=JSON.parse(JSON.stringify(strip(STORE)));
    SY.writable=true; paintSync();
    if(!d||!d.v) pushLeaves();      /* first use of an empty room */
    else if(JSON.stringify(STORE.contacts||[])!==remoteContacts){
      /* Persist complete derived contact records once so later Admin edits
         never create partial Firebase rows. */
      SY.ref.child('contacts').set(STORE.contacts||[]).catch(function(e){console.warn('directory sync failed',e);});
    }
    /* Attach Services listeners first, then attach the authoritative shared
       announcement listener last. An empty Services snapshot must never erase
       a notice already received from the main portal room. */
    watchLive();
    startSharedAnnouncementBridge();
    if(rescue.length){
      syncAnnouncementsNow().then(function(ok){if(ok){
        clearAnnouncementOutbox();
        try{localStorage.setItem(ANNOUNCEMENT_MIGRATION_KEY,'1');}catch(e){}
        if(SY.base)SY.base.announcements=announcementListCopy(STORE.announcements||[]);
      }}).catch(function(e){console.warn('announcement recovery failed',e);});
    }else try{localStorage.setItem(ANNOUNCEMENT_MIGRATION_KEY,'1');}catch(e){}
    render();
    toast('Connected to '+SY.room,true);
  }).catch(function(e){
    if(settled) return; settled=true; clearTimeout(timer);
    SY.writable=false; paintSync();
    startSharedAnnouncementBridge();
    toast('Sync failed: '+(e&&e.message||e),false);
  });
}
function strip(o){
  var c=JSON.parse(JSON.stringify(o||{}));
  delete c.vroomLive;
  /* Resource Directory is published by the main projects portal.  The Work
     Place Hub consumes it but never writes it back, so Admin edits to email
     and approval fields cannot accidentally overwrite the source roster. */
  delete c.resourceDirectory;
  return c;
}
/* Watch shared operational and Admin-managed branches. */
function watchLive(){
  ['people','contacts','resourceDirectory','auditLog','services','requests','bookings','vrooms','rooms','fleet','catalog'].forEach(function(k){
    SY.ref.child(k).on('value',function(s){
      var v=s.val();
      if(k==='catalog'){ if(!v||typeof v!=='object') return; }
      else {if(v==null)v=[];if(!Array.isArray(v)) return;}
      if(JSON.stringify(STORE[k])===JSON.stringify(v)) return;
      STORE[k]=v;
      var resourceMerged=k==='resourceDirectory'&&mergeResourceDirectory();
      if(resourceMerged&&SY.ref&&SY.writable){
        SY.ref.child('contacts').set(STORE.contacts||[]).catch(function(e){console.warn('directory sync failed',e);});
      }
      SY.base=JSON.parse(JSON.stringify(strip(STORE)));
      try{ localStorage.setItem(SK,JSON.stringify(STORE)); }catch(e){}
      if(PORTAL_LINK&&!PORTAL_LINK.handled){applyPortalLink();render();}
      else if(VIEW!=='virtual') render();
    });
  });

function diffLeaves(base,next,prefix,out,depth){
  out=out||{}; prefix=prefix||''; depth=depth||0;
  if(depth>10){ out[prefix]=next; return out; }
  var bA=Array.isArray(base), nA=Array.isArray(next);
  if(bA||nA){
    if(!bA||!nA||base.length!==next.length){
      if(JSON.stringify(base)!==JSON.stringify(next)) out[prefix]=next;
      return out;
    }
    for(var i=0;i<next.length;i++) diffLeaves(base[i],next[i],prefix+'/'+i,out,depth+1);
    return out;
  }
  var bO=base&&typeof base==='object', nO=next&&typeof next==='object';
  if(bO&&nO){
    var keys={},k;
    for(k in base) keys[k]=1;
    for(k in next) keys[k]=1;
    for(k in keys){
      var p=prefix?(prefix+'/'+k):k;
      if(!(k in next)){ out[p]=null; continue; }
      if(!(k in base)){ out[p]=next[k]; continue; }
      diffLeaves(base[k],next[k],p,out,depth+1);
    }
    return out;
  }
  if(base!==next) out[prefix]=(next===undefined?null:next);
  return out;
}
function pushLeaves(){
  if(!SY.ref||!SY.writable) return;
  var cur=strip(STORE);
  if(!SY.base){ SY.base={}; }
  var raw=diffLeaves(SY.base,cur,'',{},0);
  var map={},n=0;
  for(var k in raw){
    if(!k) continue;
    if(/[.#$\[\]]/.test(k)) continue;
    map[k]=raw[k]; n++;
  }
  if(!n) return;
  SY.ref.update(map).then(function(){
    SY.base=JSON.parse(JSON.stringify(cur));
  },function(e){
    toast('Your change was saved on this device but not shared: '+(e&&e.message||e),false);
  });
}

   V18 — RESOURCE DIRECTORY BRIDGE, ANNOUNCEMENTS & AUDIT LOG
   ═══════════════════════════════════════════════════════════════════════════ */
function resourceNameKey(v){return String(v||'').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').trim();}
function resourceContactId(r){
  var raw=String((r&&r.id)||(r&&r.empId)||(r&&r.name)||'employee'),h=5381;
  for(var i=0;i<raw.length;i++)h=((h<<5)+h)^raw.charCodeAt(i);
  return 'ctres_'+(h>>>0).toString(36);
}
/* Source-owned fields are refreshed from Resources.  Admin-owned fields
   (email, phone and approval routing) are deliberately preserved. */
function mergeResourceDirectory(){
  if(!STORE)return false;
  var src=Array.isArray(STORE.resourceDirectory)?STORE.resourceDirectory:[];
  var list=Array.isArray(STORE.contacts)?STORE.contacts:(STORE.contacts=[]),seen={},changed=false;
  src.forEach(function(r){
    if(!r||!String(r.name||'').trim())return;
    var sid=String(r.id||r.empId||resourceNameKey(r.name)),key=resourceNameKey(r.name);
    var c=list.find(function(x){return x.sourceResourceId===sid;})
      ||list.find(function(x){return r.empId&&x.employeeId&&String(x.employeeId)===String(r.empId);})
      ||list.find(function(x){return !x.sourceResourceId&&resourceNameKey(x.name)===key;});
    if(!c){
      c={id:resourceContactId(r),name:'',nameAr:'',title:'',dept:'',company:'',employeeId:'',email:'',phone:'',
        approvalLevel:0,approvalTypes:[],canApprove:false,sourceResourceId:sid,source:'resources',sourceActive:true};
      list.push(c);changed=true;
    }
    var owned={name:String(r.name||''),nameAr:String(r.nameAr||''),title:String(r.position||''),
      dept:String(r.dept||''),company:String(r.company||''),employeeId:String(r.empId||''),
      resourceStatus:String(r.status||''),sourceResourceId:sid,source:'resources',sourceActive:true};
    Object.keys(owned).forEach(function(k){if(c[k]!==owned[k]){c[k]=owned[k];changed=true;}});
    if(c.email==null)c.email='';if(c.phone==null)c.phone='';
    if(c.approvalLevel==null)c.approvalLevel=0;if(!Array.isArray(c.approvalTypes))c.approvalTypes=[];
    c.canApprove=(+c.approvalLevel||0)>0&&c.approvalTypes.length>0;seen[sid]=1;
  });
  list.forEach(function(c){
    if(c.sourceResourceId&&!seen[c.sourceResourceId]&&c.sourceActive!==false){c.sourceActive=false;changed=true;}
  });
  return changed;
}

var seedV19Base=seed;
seed=function(){
  var s=seedV19Base();
  if(!Array.isArray(s.officialLetters))s.officialLetters=[];

};
var normaliseV19Base=normalise;

  normaliseV19Base();
  if(!Array.isArray(STORE.officialLetters))STORE.officialLetters=[];
  STORE.officialLetters.forEach(function(r){
    if(!r.status)r.status='submitted';
    if(!Array.isArray(r.history))r.history=[];

    if(!r.language)r.language='ar';
    if(!r.preparationMode)r.preparationMode='gr';
    if(!r.priority)r.priority='medium';
    if(r.bookNo==null)r.bookNo='';

    if(r.rejectionReason==null)r.rejectionReason='';
  });
};

var watchLiveV19Base=watchLive;
watchLive=function(){
  watchLiveV19Base();
  SY.ref.child('officialLetters').on('value',function(s){
    var v=s.val();if(v==null)v=[];if(!Array.isArray(v))return;
    if(JSON.stringify(STORE.officialLetters)===JSON.stringify(v))return;
    STORE.officialLetters=v;normalise();

function officialPaintLetterPreview(){
  var sheet=document.getElementById('officialLetterSheet');if(!sheet)return;
  var content=sheet.querySelector('.official-letter-content'),rtl=val('ocLanguage')!=='en';
  content.classList.toggle('rtl',rtl);

  put('olpNo',val('ocBookNo')||'________________');
  put('olpDate',val('ocBookDate')||'____ / ____ / ______');
  put('olpTo',(rtl?'إلى / ':'To / ')+(val('ocRecipient')||'________________'));
  put('olpSubject',(rtl?'م / ':'Subject / ')+(val('ocSubject')||'________________'));
  put('olpBody',val('ocBody'));
  put('olpClosing',val('ocClosing'));

    var note=document.getElementById('officialLetterFitNote');if(!note)return;

function officialSaveComposer(id,issue){
  var r=(STORE.officialLetters||[]).find(function(x){return x.id===id;});if(!r||!officialCanManage())return;
  clearBad();var recipient=val('ocRecipient'),subject=val('ocSubject'),body=val('ocBody'),bookNo=val('ocBookNo'),bookDate=val('ocBookDate'),ok=true;
  if(!recipient){bad('ocRecipient','Enter the recipient');ok=false;}if(!subject){bad('ocSubject','Enter the subject');ok=false;}if(!body){bad('ocBody','Write the official letter');ok=false;}
  if(issue&&!bookNo){bad('ocBookNo','GR must enter the official letter number');ok=false;}
  if(issue&&!bookDate){bad('ocBookDate','GR must enter the official letter date');ok=false;}
  var previewContent=document.querySelector('#officialLetterSheet .official-letter-content');
  if(issue&&previewContent&&previewContent.scrollHeight>previewContent.clientHeight+4){toast('The letter exceeds one A4 page. Shorten the text before issuing it.',false);ok=false;}
  if(!ok){toast('Check the highlighted fields',false);return;}
  r.recipient=recipient;r.subject=subject;r.letterBody=body;r.bookNo=bookNo;r.bookDate=bookDate;r.language=val('ocLanguage')||'ar';r.closing=val('ocClosing');r.signatory=val('ocSign');
  if(issue){
    r.status='issued';r.issuedAt=nowISO();r.issuedBy=ME.name;
    officialHistory(r,'Official letter issued','Letter no. '+r.bookNo+' · '+r.bookDate,r.status);
    auditRecord('issue','official-letter',r.id,r.ref+' · '+r.bookNo);
  }else{
    r.status='drafting';officialHistory(r,'Draft saved by GR','',r.status);auditRecord('update','official-letter',r.id,r.ref+' · draft saved');
  }
  save();closeOfficialComposer();render();toast(issue?'Official letter issued':'Draft saved',true);
  if(issue)setTimeout(function(){openOfficialComposer(id);},80);
}
async function officialDownloadPdf(id){
  var r=(STORE.officialLetters||[]).find(function(x){return x.id===id;});if(!r||['issued','sent','closed'].indexOf(r.status)<0){toast('Issue the letter before downloading the official PDF',false);return;}
  var sheet=document.getElementById('officialLetterSheet');if(!sheet){openOfficialComposer(id);return;}
  var btns=document.querySelectorAll('#officialComposeModal .btn');btns.forEach(function(b){b.disabled=true;});
  toast('Preparing the A4 PDF…',true);
  var oldTransform=sheet.style.transform,oldMarginBottom=sheet.style.marginBottom;
  try{
    if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!(window.jspdf&&window.jspdf.jsPDF))await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await new Promise(function(resolve){
      var done=false,finish=function(){if(done)return;done=true;resolve();},img=new Image();
      img.onload=finish;img.onerror=finish;img.src='official-letter-template.png';if(img.complete)finish();setTimeout(finish,3000);
    });
    sheet.style.transform='none';sheet.style.marginBottom='0';
    await new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve);});});
    var canvas=await window.html2canvas(sheet,{scale:2,useCORS:true,backgroundColor:'#ffffff',width:794,height:1123,logging:false});
    var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    pdf.addImage(canvas.toDataURL('image/jpeg',.96),'JPEG',0,0,210,297,undefined,'FAST');
    var safe=String(r.bookNo||r.ref).replace(/[\\/:*?\"<>|]+/g,'-');
    pdf.save('Knowledge_Papers_Official_Letter_'+safe+'.pdf');
    auditRecord('download','official-letter',r.id,r.ref+' · '+r.bookNo);save();toast('Official letter PDF downloaded',true);
  }catch(e){
    toast('PDF generation failed. Use the browser print command as a fallback: '+(e&&e.message||e),false);
  }
  sheet.style.transform=oldTransform;sheet.style.marginBottom=oldMarginBottom;
  btns.forEach(function(b){b.disabled=false;});
}

function exportAll(){
  var go=function(){
    try{
      var wb=XLSX.utils.book_new();
      var head=['Ref','Type','Requested by','Department','Summary','Priority','Status',
                'Approval chain','Submitted','Needed by','Decided by','Decided at','Note'];
      var rows=[head].concat(STORE.requests.map(function(r){
        return [r.ref,requestTypeLabel(r),r.by,r.dept,summary(r),
                (PRIO[r.priority]||{}).label||'',(STATUS[r.status]||{}).label||'',
                (r.approvals||[]).map(function(a){return 'L'+(a.level||1)+' '+a.name+' ('+(a.status||'pending')+')';}).join(', '),
                r.created,r.needed||'',r.decidedBy||'',r.decidedAt||'',r.note||''];
      }));
      var ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:11},{wch:14},{wch:20},{wch:15},{wch:44},{wch:10},{wch:12},{wch:38},{wch:22},{wch:16},{wch:18},{wch:22},{wch:40}];
      ws['!freeze']={xSplit:1,ySplit:1};
      XLSX.utils.book_append_sheet(wb,ws,'Requests');

      var oh=[['Tracker ID','Requester','Department','Recipient','Subject','Purpose','Priority','Status','Requested at','Needed by','Official letter no.','Official letter date','Rejected/return reason','Last update']];
      (STORE.officialLetters||[]).forEach(function(r){
        oh.push([r.ref,r.by,r.dept,r.recipient,r.subject,r.purpose,r.priority,(OFFICIAL_STATUS[r.status]||{}).label||r.status,r.created,r.neededBy||'',r.bookNo||'',r.bookDate||'',r.rejectionReason||'',r.updated]);
      });
      var wo=XLSX.utils.aoa_to_sheet(oh);
      wo['!cols']=[{wch:18},{wch:22},{wch:18},{wch:32},{wch:36},{wch:50},{wch:10},{wch:20},{wch:22},{wch:13},{wch:20},{wch:18},{wch:45},{wch:22}];
      XLSX.utils.book_append_sheet(wb,wo,'Official correspondence');

      var bh=[['Title','Date','From','To','Room','Called by','Department','Invited','Emails','Phones','Virtual','Agenda']];
      STORE.bookings.forEach(function(b){
        var rm=STORE.rooms.find(function(r){ return r.id===b.roomId; });
        bh.push([b.title,b.date,b.start,b.end,rm?rm.name:'Virtual only',b.by,b.dept||'',

      XLSX.utils.book_append_sheet(wb,wb2,'Meetings');

      var ih=[['Item','Unit','Total requested','Times requested']];
      var tally={};
      STORE.requests.forEach(function(r){
        ((r.details||{}).items||[]).forEach(function(i){
          var k=i.name+'|'+i.unit;
          if(!tally[k]) tally[k]={name:i.name,unit:i.unit,qty:0,n:0};
          tally[k].qty+=+i.qty||0; tally[k].n++;
        });
      });
      Object.keys(tally).forEach(function(k){ ih.push([tally[k].name,tally[k].unit,tally[k].qty,tally[k].n]); });
      var wb3=XLSX.utils.aoa_to_sheet(ih);
      wb3['!cols']=[{wch:30},{wch:16},{wch:16},{wch:16}];
      XLSX.utils.book_append_sheet(wb,wb3,'Items ordered');
